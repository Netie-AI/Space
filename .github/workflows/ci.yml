name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  merge_group:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-windows:
    name: build (windows)
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "8.0.x"
          cache: true
          cache-dependency-path: |
            **/*.csproj
            **/*.sln
      - name: Restore, build, and test
        run: >
          dotnet test NetieSpace.sln -c Debug --nologo
          --blame-hang-timeout 2m
          --logger "trx;LogFileName=test-results.trx"

  python-syntax:
    name: python syntax
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: compileall
        run: python -m compileall -q -f tests scripts
      - name: contract tests
        run: |
          set -euo pipefail
          for f in tests/test_*.py; do
            echo "== $f"
            python "$f"
          done

  license-api:
    name: license-api
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: license-api
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: license-api/package-lock.json
      - name: typecheck
        run: |
          npm ci --legacy-peer-deps
          npm run typecheck

  ci:
    name: ci
    if: always()
    needs: [build-windows, python-syntax, license-api]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require all jobs green
        run: |
          echo "windows=${{ needs.build-windows.result }}"
          echo "python=${{ needs.python-syntax.result }}"
          echo "license=${{ needs.license-api.result }}"
          test "${{ needs.build-windows.result }}" = success
          test "${{ needs.python-syntax.result }}" = success
          test "${{ needs.license-api.result }}" = success
