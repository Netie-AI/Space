name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  merge_group:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-windows:
    name: build (windows)
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "8.0.x"
          cache: true
          cache-dependency-path: |
            **/*.csproj
            **/*.sln
      # Chocolatey community feed 504s (ffmpeg 9.0.1). GyanD GitHub builds instead.
      - uses: FedericoCarboni/setup-ffmpeg@v3
        with:
          ffmpeg-version: release
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: ffmpeg version
        run: ffmpeg -hide_banner -version && ffprobe -hide_banner -version
      - name: Restore, build, and test
        run: >
          dotnet test NetieSpace.sln -c Debug --nologo
          --blame-hang-timeout 2m
          --logger "trx;LogFileName=test-results.trx"
      - name: pillar1 wipe reference encode
        shell: pwsh
        run: ./scripts/encode-pillar1-wipe.ps1 -Out "$env:RUNNER_TEMP/pillar1"

  python-syntax:
    name: python syntax
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: compileall
        run: python -m compileall -q -f tests scripts
      - name: contract tests
        run: |
          set -euo pipefail
          for f in tests/test_*.py; do
            echo "== $f"
            python "$f"
          done
      - name: pillar1 wipe reference encode
        run: ./scripts/encode-pillar1-wipe.sh "$(mktemp -d)"

  license-api:
    name: license-api
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: license-api
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: license-api/package-lock.json
      - name: typecheck
        run: |
          npm ci --legacy-peer-deps
          npm run typecheck

  # No 4th aggregator job. Workflow already fails if any of the three fail.
  # After #25, aggregator `ci` never started: GitHub billing/spending limit.
