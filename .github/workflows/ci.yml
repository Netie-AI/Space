name: CI

# Python + Linux wipe. Windows and license-api are sibling workflows with
# path filters so a leftover dest PR does not start windows-latest (2x minutes).
# Hosted runners stay billing-locked until org Billing is fixed
# (docs/HUMAN_GHA_BILLING.md). Do not merge on that red.

on:
  push:
    branches: [main]
    paths:
      - "tests/**"
      - "tools/**"
      - "scripts/**/*.sh"
      - "scripts/ci-cursor.sh"
      - ".github/workflows/ci.yml"
  pull_request:
    paths:
      - "tests/**"
      - "tools/**"
      - "scripts/**/*.sh"
      - "scripts/ci-cursor.sh"
      - ".github/workflows/ci.yml"
  workflow_dispatch:
  merge_group:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  python-syntax:
    name: python syntax
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: compileall
        run: python -m compileall -q -f tests scripts
      - name: contract tests
        run: |
          set -euo pipefail
          for f in tests/test_*.py; do
            echo "== $f"
            python "$f"
          done
      - name: pillar1 wipe reference encode
        run: ./scripts/encode-pillar1-wipe.sh "$(mktemp -d)"
