name: package

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'installer/**'
      - 'scripts/publish.ps1'
      - 'scripts/build-installer.ps1'
      - 'scripts/check-installer.ps1'
      - '.github/workflows/package.yml'

permissions:
  contents: read

jobs:
  installer:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'
      - name: Publish (Release, self-contained)
        shell: powershell
        run: .\scripts\publish.ps1 -NoRegister
      - name: Engine licence gate on the published folder
        shell: powershell
        run: |
          .\scripts\check-tool-engines.ps1 -Dist dist\NetieSpace
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - name: Ensure Inno Setup 6
        shell: powershell
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (Test-Path $iscc) { Write-Host "ISCC preinstalled on runner: $iscc" }
          else {
            Write-Host "ISCC NOT preinstalled; installing Inno Setup with choco"
            choco install innosetup --no-progress -y
            if (-not (Test-Path $iscc)) { Write-Host "ISCC still missing"; exit 1 }
          }
      - name: Compile installer
        shell: powershell
        run: |
          .\scripts\build-installer.ps1
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - name: Check installer (install, run, uninstall)
        shell: powershell
        run: |
          .\scripts\check-installer.ps1 -OutDir dist\installer-check
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - name: Report setup size
        if: always()
        shell: powershell
        run: |
          $s = "dist\installer\NetieSpace-Setup.exe"
          if (Test-Path $s) { "{0} bytes" -f (Get-Item $s).Length }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: netie-space-setup
          path: dist/installer/NetieSpace-Setup.exe
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: netie-space-setup-check
          path: dist/installer-check/
          if-no-files-found: warn
