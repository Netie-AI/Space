name = "netie-space-license"
main = "src/index.ts"
compatibility_date = "2025-06-01"
compatibility_flags = ["nodejs_compat"]

# Create with: npx wrangler d1 create netie-licenses
# Then paste the database_id below.
[[d1_databases]]
binding = "DB"
database_name = "netie-licenses"
database_id = "REPLACE_AFTER_D1_CREATE"

# Optional R2 for installer downloads (one-shot tokens)
# [[r2_buckets]]
# binding = "INSTALLERS"
# bucket_name = "netie-space-installers"

[vars]
APP_NAME = "Netie Space"
# Public CORS origins (comma-separated). Empty = allow all (dev).
CORS_ORIGINS = ""
# Buyer-facing app / download site base (no trailing slash)
PUBLIC_BASE_URL = "https://netie-space-license.workers.dev"
# Test-mode Price on Stripe account NETIE (product netie_space, $9/mo).
# Not a secret. Override with `wrangler secret put STRIPE_PRICE_ID` for live.
STRIPE_PRICE_ID = "price_1U8ckCFV5wcFod2faXiUCsaV"

# Secrets (set via: npx wrangler secret put NAME):
# RESEND_API_KEY
# OWNER_NOTIFY_EMAIL
# RESEND_FROM_EMAIL
# JWT_SECRET
# DEVICE_PEPPER
# STRIPE_SECRET_KEY   (restricted rk_ preferred)
# STRIPE_PRICE_ID     (optional secret override; test price is in [vars])
# STRIPE_WEBHOOK_SECRET  (whsec_... from Dashboard or `stripe listen`)
