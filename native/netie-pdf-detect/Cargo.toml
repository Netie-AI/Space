[package]
name = "netie-pdf-detect"
version = "0.1.0"
edition = "2021"
description = "Snap-to-cell detector for Netie Space Fill & Sign (no network)"

[[bin]]
name = "netie-pdf-detect"
path = "src/main.rs"

[dependencies]
image = { version = "0.25", default-features = false, features = ["png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
