<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Netie Markdown</title>
  <link rel="stylesheet" href="katex/katex.min.css"/>
  <script src="marked.min.js"></script>
  <script src="katex/katex.min.js"></script>
  <script src="katex/auto-render.min.js"></script>
  <style>
    :root { color-scheme: dark; --fs: 14.5px; --lh: 1.55; --ff: "Cascadia Code", Consolas, monospace; --imgmax: 100%; --accent: #5ec4b8; }
    html, body { margin: 0; height: 100%; background: #10141c; color: #f2f4f8;
      font: 14px/1.55 "Segoe UI Variable", "Segoe UI", sans-serif; overflow: hidden; }
    html.light { color-scheme: light; }
    html.light body { background: #f3f0e8; color: #1a1c1e; }
    #bar {
      display: flex; gap: 6px; align-items: center; flex-wrap: wrap;
      padding: 8px 12px; background: rgba(22,28,38,0.85);
      border-bottom: 1px solid rgba(255,255,255,0.12);
      transition: transform 0.18s ease, opacity 0.18s ease;
    }
    html.light #bar { background: rgba(255,255,255,0.92); border-bottom-color: rgba(0,0,0,0.08); }
    body.bar-off #bar { transform: translateY(-110%); opacity: 0; pointer-events: none; }
    body.bar-off #main { height: 100%; }
    #bar button, #bar input {
      background: rgba(42,49,64,0.85); color: #f2f4f8; border: 1px solid rgba(255,255,255,0.14);
      border-radius: 10px; padding: 6px 10px; font-weight: 600; font: inherit;
    }
    #bar button { cursor: pointer; }
    #bar button.on { outline: 1px solid var(--accent); }
    html.light #bar button, html.light #bar input { background: #fff; color: #1a1c1e; border-color: rgba(0,0,0,0.12); }
    #bar input { width: 140px; font-weight: 500; }
    #bar .hint { color: #a8b0c0; font-size: 12px; margin-left: auto; }
    #main { display: flex; height: calc(100% - 44px); min-height: 0; }
    #side {
      display: none; flex: 0 0 188px; width: 188px; overflow: auto;
      border-right: 1px solid rgba(255,255,255,0.1); background: #0c1016; padding: 10px 8px 24px;
    }
    html.light #side { background: #efebe3; border-right-color: rgba(0,0,0,0.08); }
    #main.side-on #side { display: block; }
    #side h2 { margin: 0 0 6px; font-size: 11px; letter-spacing: 0.04em; text-transform: uppercase; color: #a8b0c0; }
    #side .empty { color: #7a8494; font-size: 12px; }
    #outline button, #notes button {
      display: block; width: 100%; text-align: left; background: transparent; color: inherit;
      border: 0; padding: 4px 6px; border-radius: 6px; cursor: pointer; font: inherit; font-size: 12px;
    }
    #outline button:hover, #notes button:hover { background: rgba(94,196,184,0.16); }
    #outline .l2 { padding-left: 12px; }
    #outline .l3 { padding-left: 20px; }
    #outline .l4 { padding-left: 28px; }
    #split { display: grid; grid-template-columns: 1fr 1fr; flex: 1; min-width: 0; height: 100%; }
    #split.source-only { grid-template-columns: 1fr; }
    #split.preview-only #srcWrap { display: none; }
    #split.preview-only { grid-template-columns: 1fr; }
    #split.source-only #prevWrap { display: none; }
    #src, #prev {
      height: 100%; margin: 0; overflow: auto; box-sizing: border-box;
    }
    #src {
      width: 100%; border: 0; resize: none; padding: 16px 18px 40px;
      background: #121820; color: #f2f4f8;
      font: var(--fs)/var(--lh) var(--ff); outline: none;
    }
    html.light #src { background: #fff; color: #1a1c1e; }
    #prev {
      padding: 16px 22px 40px; border-left: 1px solid rgba(255,255,255,0.1);
      background: #0e1218; font: var(--fs)/var(--lh) var(--ff);
    }
    html.light #prev { background: #faf8f2; border-left-color: rgba(0,0,0,0.08); color: #1a1c1e; }
    #prev.narrow { max-width: 720px; margin: 0 auto; }
    #prev h1, #prev h2, #prev h3 { color: #fff; font-weight: 700; }
    html.light #prev h1, html.light #prev h2, html.light #prev h3 { color: #1a1c1e; }
    #prev a { color: var(--accent); }
    #prev code { background: rgba(255,255,255,0.08); padding: 1px 5px; border-radius: 4px; }
    #prev pre { background: rgba(0,0,0,0.35); padding: 12px; border-radius: 8px; overflow: auto; }
    #prev blockquote { border-left: 3px solid var(--accent); margin-left: 0; padding-left: 12px; color: #c8d0dc; }
    #prev table { border-collapse: collapse; width: 100%; margin: 12px 0; }
    #prev th, #prev td { border: 1px solid rgba(255,255,255,0.14); padding: 6px 10px; }
    #prev th { background: #1c2430; }
    #prev input[type="checkbox"] { margin-right: 8px; accent-color: var(--accent); }
    #prev del, #prev s { text-decoration: line-through; opacity: 0.85; }
    #prev img { max-width: var(--imgmax); height: auto; }
    #prev h4 { color: inherit; font-weight: 700; }
    #prev mark, #prev .md-mark {
      background: rgba(94,196,184,0.38); color: inherit; padding: 0 3px; border-radius: 3px;
    }
  </style>
</head>
<body>
  <div id="bar">
    <button type="button" id="btnSplit" class="on">Split</button>
    <button type="button" id="btnSource">Source</button>
    <button type="button" id="btnPreview">Preview</button>
    <button type="button" id="btnSide" class="on">Side</button>
    <button type="button" id="btnWidth">Narrow</button>
    <button type="button" id="btnTheme">Dark</button>
    <button type="button" id="btnSmaller" title="Smaller type">A-</button>
    <button type="button" id="btnLarger" title="Larger type">A+</button>
    <button type="button" id="btnLh" title="Line spacing">Space</button>
    <button type="button" id="btnFont" title="Typeface">Mono</button>
    <button type="button" id="btnImg" title="Image width">Img</button>
    <button type="button" id="btnAnnot" title="Wrap selection as a highlight that saves in the file">Annotate</button>
    <input id="noteIn" type="text" maxlength="160" placeholder="optional note" title="Annotate uses this as the mark title"/>
    <button type="button" id="btnAsk" title="Send selection to chat (host wires later)">Ask</button>
    <span class="hint" id="hint">Offline Marked (MIT) · chrome hides idle</span>
  </div>
  <div id="main" class="side-on">
    <aside id="side">
      <h2>Outline</h2>
      <div id="outline"><span class="empty">No headings</span></div>
      <h2 style="margin-top:14px">Notes</h2>
      <div id="notes"><span class="empty">No notes</span></div>
    </aside>
    <div id="split">
      <div id="srcWrap"><textarea id="src" spellcheck="false"></textarea></div>
      <div id="prevWrap"><div id="prev"></div></div>
    </div>
  </div>
  <script>
    const src = document.getElementById('src');
    const prev = document.getElementById('prev');
    const split = document.getElementById('split');
    const main = document.getElementById('main');
    const params = new URLSearchParams(location.search);
    const mqLight = window.matchMedia('(prefers-color-scheme: light)');
    let mode = 'split';
    let saveTimer = 0;
    let syncing = false;
    let narrow = true;
    let hideTimer = 0;
    let typePx = 14.5;
    let theme = 'dark';

    function post(obj) {
      try { chrome.webview.postMessage(JSON.stringify(obj)); } catch (_) {}
    }

    function esc(s) {
      return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/"/g, '&quot;');
    }

    function eqToMark(md) {
      const parts = String(md || '').split(/(```[\s\S]*?```|`[^`\n]+`)/);
      return parts.map((p, i) => i % 2 ? p : p.replace(/==([^=\n]+)==/g, '<mark>$1</mark>')).join('');
    }

    function jumpTo(pos) {
      const n = Math.max(0, Math.min(Number(pos) || 0, (src.value || '').length));
      src.focus();
      src.setSelectionRange(n, n);
      const line = (src.value.slice(0, n).split('\n').length) - 1;
      const lh = parseFloat(getComputedStyle(src).lineHeight) || 22;
      src.scrollTop = Math.max(0, line * lh - 48);
      emitSelection();
    }

    function paintOutline() {
      const box = document.getElementById('outline');
      if (!box) return;
      const lines = (src.value || '').split('\n');
      let pos = 0;
      const html = [];
      let hi = 0;
      lines.forEach((line) => {
        const m = /^(#{1,4})\s+(.+)$/.exec(line);
        if (m) {
          html.push('<button type="button" class="ol l' + m[1].length + '" data-pos="' + pos + '" data-h="' + hi + '">' + esc(m[2]) + '</button>');
          hi += 1;
        }
        pos += line.length + 1;
      });
      box.innerHTML = html.join('') || '<span class="empty">No headings</span>';
    }

    function paintNotes() {
      const box = document.getElementById('notes');
      if (!box) return;
      const t = src.value || '';
      const items = [];
      const re = /<mark\s+title="([^"]*)">([\s\S]*?)<\/mark>/gi;
      let m;
      while ((m = re.exec(t))) {
        items.push({ note: m[1], text: m[2].replace(/\s+/g, ' ').slice(0, 48), pos: m.index });
      }
      box.innerHTML = items.map((n) =>
        '<button type="button" data-pos="' + n.pos + '">' + esc(n.note || n.text) + '</button>'
      ).join('') || '<span class="empty">No notes</span>';
    }

    function annotateSel() {
      const a = src.selectionStart, b = src.selectionEnd;
      const t = src.value || '';
      if (a === b) {
        document.getElementById('hint').textContent = 'Select text to annotate';
        return;
      }
      const sel = t.slice(a, b);
      const unwrapHtml = /^<mark(?:\s[^>]*)?>([\s\S]*)<\/mark>$/i.exec(sel);
      const unwrapEq = /^==([\s\S]*)==$/.exec(sel);
      let next;
      if (unwrapHtml || unwrapEq) {
        next = unwrapHtml ? unwrapHtml[1] : unwrapEq[1];
      } else {
        const note = (document.getElementById('noteIn').value || '').trim();
        next = note ? ('<mark title="' + esc(note) + '">' + sel + '</mark>') : ('==' + sel + '==');
      }
      src.value = t.slice(0, a) + next + t.slice(b);
      src.selectionStart = a;
      src.selectionEnd = a + next.length;
      render();
      scheduleSave();
    }

    function mdAsk() {
      const a = src.selectionStart, b = src.selectionEnd;
      const text = a !== b ? src.value.slice(a, b) : (src.value || '').slice(0, 4000);
      post({ type: 'mdAsk', text: text });
      document.getElementById('hint').textContent = 'Ask posted · chat wire waits host';
    }

    function emitSelection() {
      const a = src.selectionStart, b = src.selectionEnd;
      post({ type: 'mdSelection', text: (src.value || '').slice(a, b), start: a, end: b });
    }

    function applyTheme() {
      const light = theme === 'light' || (theme === 'system' && mqLight.matches);
      document.documentElement.classList.toggle('light', light);
      const btn = document.getElementById('btnTheme');
      btn.textContent = theme === 'system' ? 'System' : (light ? 'Light' : 'Dark');
      btn.classList.toggle('on', theme !== 'dark');
    }

    function render() {
      try {
        if (typeof marked !== 'undefined') {
          marked.setOptions({ gfm: true, breaks: false });
          prev.innerHTML = marked.parse(eqToMark(src.value || ''));
          prev.querySelectorAll('input[type="checkbox"]').forEach((box, i) => {
            box.disabled = false;
            box.dataset.task = String(i);
          });
          prev.querySelectorAll('h1,h2,h3,h4').forEach((h, i) => { h.id = 'h-' + i; });
          if (typeof renderMathInElement === 'function') {
            renderMathInElement(prev, {
              delimiters: [
                { left: '$$', right: '$$', display: true },
                { left: '\\[', right: '\\]', display: true },
                { left: '$', right: '$', display: false },
                { left: '\\(', right: '\\)', display: false }
              ],
              throwOnError: false,
              ignoredTags: ['script', 'noscript', 'style', 'textarea', 'pre', 'code']
            });
          }
        } else {
          prev.textContent = src.value || '';
        }
      } catch (e) {
        prev.textContent = src.value || '';
      }
      paintCount();
      paintOutline();
      paintNotes();
    }

    function toggleTask(index) {
      let n = 0;
      src.value = (src.value || '').replace(/^(\s*[-*+]\s+)\[([ xX])\]/gm, (m, lead, mark) => {
        if (n++ !== index) return m;
        return lead + (mark === ' ' ? '[x]' : '[ ]');
      });
      render();
      scheduleSave();
    }

    function syncFrom(el, other) {
      if (syncing || mode !== 'split') return;
      const max = el.scrollHeight - el.clientHeight;
      if (max <= 0) return;
      syncing = true;
      const r = el.scrollTop / max;
      const omax = other.scrollHeight - other.clientHeight;
      other.scrollTop = r * Math.max(0, omax);
      syncing = false;
    }

    function wrapSel(left, right) {
      const a = src.selectionStart, b = src.selectionEnd;
      const t = src.value || '';
      src.value = t.slice(0, a) + left + t.slice(a, b) + right + t.slice(b);
      src.selectionStart = a + left.length;
      src.selectionEnd = b + left.length;
      src.focus();
      render();
      scheduleSave();
    }

    function paintCount() {
      const t = src.value || '';
      const words = t.trim() ? t.trim().split(/\s+/).length : 0;
      const hint = document.getElementById('hint');
      if (hint) hint.textContent = words + ' words · ' + t.length + ' chars · Split=syntax · Ctrl+B/I/M · chrome hides idle';
    }

    function applyTypeSize() {
      document.documentElement.style.setProperty('--fs', typePx + 'px');
    }

    function showBar() {
      document.body.classList.remove('bar-off');
      clearTimeout(hideTimer);
      hideTimer = setTimeout(() => {
        if (document.getElementById('bar').matches(':hover')) return;
        document.body.classList.add('bar-off');
      }, 2800);
    }

    function scheduleSave() {
      post({ type: 'netieTyping', typing: true });
      clearTimeout(saveTimer);
      saveTimer = setTimeout(() => {
        post({ type: 'textEdit', text: src.value || '' });
        post({ type: 'netieTyping', typing: false });
      }, 400);
    }

    function setMode(m) {
      mode = m;
      split.classList.remove('source-only', 'preview-only');
      document.getElementById('btnSplit').classList.toggle('on', m === 'split');
      document.getElementById('btnSource').classList.toggle('on', m === 'source');
      document.getElementById('btnPreview').classList.toggle('on', m === 'preview');
      if (m === 'source') split.classList.add('source-only');
      if (m === 'preview') split.classList.add('preview-only');
      if (m !== 'source') render();
    }

    document.getElementById('btnSplit').onclick = () => setMode('split');
    document.getElementById('btnSource').onclick = () => setMode('source');
    document.getElementById('btnPreview').onclick = () => setMode('preview');
    document.getElementById('btnSide').onclick = () => {
      const on = main.classList.toggle('side-on');
      document.getElementById('btnSide').classList.toggle('on', on);
    };
    document.getElementById('btnWidth').onclick = () => {
      narrow = !narrow;
      prev.classList.toggle('narrow', narrow);
      document.getElementById('btnWidth').textContent = narrow ? 'Narrow' : 'Wide';
      document.getElementById('btnWidth').classList.toggle('on', narrow);
    };
    prev.classList.add('narrow');
    document.getElementById('btnWidth').classList.add('on');
    document.getElementById('btnTheme').onclick = () => {
      theme = theme === 'dark' ? 'light' : theme === 'light' ? 'system' : 'dark';
      applyTheme();
    };
    mqLight.addEventListener('change', () => { if (theme === 'system') applyTheme(); });
    document.getElementById('btnSmaller').onclick = () => {
      typePx = Math.max(12, typePx - 1);
      applyTypeSize();
    };
    document.getElementById('btnLarger').onclick = () => {
      typePx = Math.min(22, typePx + 1);
      applyTypeSize();
    };
    document.getElementById('btnLh').onclick = () => {
      const cur = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--lh')) || 1.55;
      const next = cur < 1.5 ? 1.55 : cur < 1.7 ? 1.8 : 1.4;
      document.documentElement.style.setProperty('--lh', String(next));
    };
    const fonts = [
      { n: 'Mono', v: '"Cascadia Code", Consolas, monospace' },
      { n: 'Sans', v: '"Segoe UI Variable", "Segoe UI", sans-serif' },
      { n: 'Serif', v: 'Georgia, "Times New Roman", serif' }
    ];
    let fontI = 0;
    document.getElementById('btnFont').onclick = () => {
      fontI = (fontI + 1) % fonts.length;
      document.documentElement.style.setProperty('--ff', fonts[fontI].v);
      document.getElementById('btnFont').textContent = fonts[fontI].n;
    };
    const imgs = ['100%', '70%', '40%'];
    let imgI = 0;
    document.getElementById('btnImg').onclick = () => {
      imgI = (imgI + 1) % imgs.length;
      document.documentElement.style.setProperty('--imgmax', imgs[imgI]);
      document.getElementById('btnImg').textContent = 'Img ' + imgs[imgI];
    };
    document.getElementById('btnAnnot').onclick = annotateSel;
    document.getElementById('btnAsk').onclick = mdAsk;
    document.getElementById('outline').addEventListener('click', (ev) => {
      const btn = ev.target.closest('button[data-pos]');
      if (!btn) return;
      jumpTo(btn.dataset.pos);
      const h = document.getElementById('h-' + btn.dataset.h);
      if (h) h.scrollIntoView({ block: 'center' });
    });
    document.getElementById('notes').addEventListener('click', (ev) => {
      const btn = ev.target.closest('button[data-pos]');
      if (btn) jumpTo(btn.dataset.pos);
    });
    src.addEventListener('keydown', (ev) => {
      if (!(ev.ctrlKey || ev.metaKey)) return;
      if (ev.key === 'b' || ev.key === 'B') { ev.preventDefault(); wrapSel('**', '**'); }
      if (ev.key === 'i' || ev.key === 'I') { ev.preventDefault(); wrapSel('*', '*'); }
      if (ev.key === 'm' || ev.key === 'M') { ev.preventDefault(); annotateSel(); }
      if (ev.key === 'Enter') { ev.preventDefault(); mdAsk(); }
    });
    src.addEventListener('mouseup', emitSelection);
    src.addEventListener('keyup', emitSelection);
    src.addEventListener('select', emitSelection);
    window.addEventListener('mousemove', (ev) => { if (ev.clientY < 56) showBar(); });
    document.getElementById('bar').addEventListener('mouseenter', showBar);
    showBar();
    applyTypeSize();
    applyTheme();
    src.addEventListener('input', () => { render(); scheduleSave(); });
    src.addEventListener('scroll', () => syncFrom(src, prev));
    prev.addEventListener('scroll', () => syncFrom(prev, src));
    prev.addEventListener('click', (ev) => {
      const t = ev.target;
      if (t && t.type === 'checkbox' && t.dataset.task != null) {
        ev.preventDefault();
        toggleTask(Number(t.dataset.task));
      }
    });
    src.addEventListener('blur', () => {
      post({ type: 'textEdit', text: src.value || '' });
      post({ type: 'netieTyping', typing: false });
    });
    window.__netieSave = () => post({ type: 'textEdit', text: src.value || '' });
    window.__eqToMark = eqToMark;
    window.__annotateSel = annotateSel;

    window.addEventListener('message', (ev) => {
      try {
        const msg = typeof ev.data === 'string' ? JSON.parse(ev.data) : ev.data;
        if (msg?.type === 'setMarkdown' && typeof msg.text === 'string') {
          src.value = msg.text;
          render();
        }
      } catch (_) {}
    });

    try {
      chrome.webview.addEventListener('message', (ev) => {
        try {
          const msg = typeof ev.data === 'string' ? JSON.parse(ev.data) : ev.data;
          if (msg?.type === 'setMarkdown' && typeof msg.text === 'string') {
            src.value = msg.text;
            render();
          }
        } catch (_) {}
      });
    } catch (_) {}

    if (params.get('boot') === '1') {
      src.placeholder = 'Loading…';
    }
    if (params.get('demo') === '1') {
      src.value = '# Demo note\n\n**Markdown** is just _text_ without the right software.\n\n==keep this dump==\n\n## Nested\n\n- [ ] task\n- [x] done\n\n### Math\n\n$x^2+1$\n\nSelect a sentence, optional note, Annotate. Ctrl+M. Split shows syntax; Preview hides it.\n';
      render();
    }
    src.focus();
  </script>
</body>
</html>
