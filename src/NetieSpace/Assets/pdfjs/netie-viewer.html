<!DOCTYPE html>
<html lang="en" class="doc-app">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Netie PDF</title>
  <style>
    :root {
      color-scheme: dark;
      --glass: rgba(22, 28, 38, 0.52);
      --glass-border: rgba(255, 255, 255, 0.14);
      --glass-hi: rgba(255, 255, 255, 0.08);
      --accent: #5ec4b8;
      --text: #f2f4f8;
      --muted: #a8b0c0;
      --chip: rgba(42, 49, 64, 0.72);
    }
    html.doc-app {
      color-scheme: light;
      --doc-canvas: #E8E8E8;
      --doc-toolbar: #F5F5F5;
      --doc-rail: #F3F3F3;
      --doc-page: #FFFFFF;
      --doc-line: #D6D6D6;
      --doc-text: #2C2C2C;
      --doc-muted: #6E6E6E;
      --doc-accent: #0B5CAB;
      --doc-hover: #E8F2FF;
      --doc-on: #D6E8F8;
      --doc-save: #0B5CAB;
      --accent: #0B5CAB;
      --text: #2C2C2C;
      --muted: #6E6E6E;
      --chip: #FFFFFF;
      --glass: #F5F5F5;
      --glass-border: #D6D6D6;
      --glass-hi: #FFFFFF;
    }
    html, body { margin: 0; height: 100%; background: var(--doc-canvas, #E8E8E8); color: var(--text);
      font: 600 13px "Segoe UI Variable Display", "Segoe UI Variable", "Segoe UI", sans-serif;
      overflow: hidden; user-select: none;
      display: flex; flex-direction: column; }
    html:not(.doc-app), html:not(.doc-app) body { background: #10141c; color: var(--text); }
    html.doc-app, html.doc-app body { background: var(--doc-canvas); color: var(--doc-text);
      font-weight: 600; }
    *::-webkit-scrollbar { width: 8px; height: 8px; }
    *::-webkit-scrollbar-button { display: none; width: 0; height: 0; }
    *::-webkit-scrollbar-corner { background: transparent; }
    *::-webkit-scrollbar-track { background: transparent; }
    *::-webkit-scrollbar-thumb {
      background: rgba(255,255,255,0.22); border-radius: 999px;
      border: 2px solid transparent; background-clip: content-box; }
    *::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.36); background-clip: content-box; }
    * { scrollbar-width: thin; scrollbar-color: rgba(255,255,255,0.28) transparent; }
    html.doc-app *::-webkit-scrollbar-thumb { background: #C4C4C4; background-clip: content-box; }
    html.doc-app *::-webkit-scrollbar-thumb:hover { background: #A8A8A8; background-clip: content-box; }
    html.doc-app * { scrollbar-color: #C4C4C4 transparent; }
    @media (prefers-reduced-motion: reduce) {
      #toolbar button:active { transform: none !important; }
      #viewer { scroll-behavior: auto !important; }
    }
    #toolbar {
      flex: 0 0 auto; display: flex; gap: 8px; align-items: center; padding: 6px 10px; flex-wrap: wrap;
      background: var(--glass); border-bottom: 1px solid var(--glass-border); box-shadow: none; }
    html.doc-app #toolbar { background: var(--doc-toolbar); }
    #toolbar button, #toolbar input[type="number"], #toolbar input[type="search"] {
      background: var(--chip); color: var(--text); border: 1px solid var(--glass-border);
      border-radius: 4px; padding: 6px 8px; cursor: pointer;
      font: 600 12px "Segoe UI", sans-serif;
      letter-spacing: 0; box-shadow: none;
      transition: background 120ms ease-out, border-color 120ms ease-out;
      touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
    #toolbar button { display: inline-flex; align-items: center; gap: 5px; }
    #toolbar button svg { width: 18px; height: 18px; flex: 0 0 18px; }
    #toolbar button .lbl { font-weight: 600; }
    #toolbar button:active { transform: none; }
    #toolbar button:hover { background: var(--doc-hover, rgba(94, 196, 184, 0.22));
      border-color: var(--doc-accent, rgba(94, 196, 184, 0.45)); }
    #toolbar .sep { width: 1px; height: 20px; background: var(--doc-line, var(--glass-border));
      margin: 0 4px; flex: 0 0 1px; align-self: center; }
    #toolbar input[type="number"] {
      width: 52px; text-align: center; cursor: text; -moz-appearance: textfield;
      padding: 6px 4px; font-weight: 700; display: inline-block; }
    #toolbar input[type="number"]::-webkit-outer-spin-button,
    #toolbar input[type="number"]::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
    #toolbar input[type="search"] {
      width: 168px; cursor: text; font-weight: 600; font-size: 13px;
      border-radius: 4px; }
    #pageTotal { opacity: 0.75; font-size: 12px; min-width: 36px; font-weight: 600; }
    #toolbar button.accent { background: var(--doc-on, rgba(94, 196, 184, 0.28));
      border-color: var(--doc-accent, rgba(94, 196, 184, 0.55)); }
    #toolbar #stampBtn { display: none; }
    #toolbar #stampBtn.active { display: inline-flex; }
    #toolbar button.hot { background: var(--doc-accent, var(--accent)); color: #fff;
      border-color: var(--doc-accent, var(--accent)); }
    #toolbar button.on { background: var(--doc-on, var(--accent));
      color: var(--doc-text, #0e1218); border-color: var(--doc-accent, var(--accent)); }
    #searchWrap { display: flex; align-items: center; gap: 4px; }
    #searchPanel { display: none; align-items: center; gap: 4px; }
    #searchPanel.open { display: flex; }
    #searchToggle.on { background: var(--doc-on, var(--accent));
      color: var(--doc-text, #0e1218); border-color: var(--doc-accent, var(--accent)); }
    #main { display: flex; flex: 1; min-height: 0; height: auto; position: relative; width: 100%; }
    #thumbs { width: 120px; overflow: auto; background: var(--doc-rail, #F3F3F3);
      border-right: 1px solid var(--glass-border); padding: 8px; box-sizing: border-box;
      display: grid; grid-template-columns: 1fr; gap: 8px; align-content: start; flex: 0 0 120px; }
    html.doc-app #thumbs { background: var(--doc-rail); }
    #thumbs canvas { width: 100%; display: block; border-radius: 2px; aspect-ratio: 3/4; object-fit: cover;
      border: 2px solid transparent; cursor: pointer; background: #fff; box-sizing: border-box; }
    #thumbs .thumb-item { display: grid; gap: 4px; justify-items: center; }
    #thumbs .thumb-item canvas { border-color: transparent; }
    #thumbs canvas.active, #thumbs .thumb-item.active canvas { border-color: var(--doc-accent, var(--accent)); }
    #thumbs .thumb-num { font-size: 11px; font-weight: 600; color: var(--doc-muted, var(--muted)); }
    #thumbs .thumb-more { opacity: .9; font-size: 11px; text-align: center; padding: 6px 2px;
      font-weight: 700; background: var(--chip); border: 1px solid var(--glass-border);
      border-radius: 4px; color: var(--text); cursor: pointer; }
    #viewer { flex: 1; overflow: auto; text-align: center; padding: 14px 12px; position: relative;
      cursor: default; scroll-behavior: auto; min-height: 0; min-width: 0; background: var(--doc-canvas, #E8E8E8);
      display: flex; flex-direction: column; align-items: center; }
    html:not(.doc-app) #viewer { background: #10141c; }
    html.doc-app #viewer { background: var(--doc-canvas); }
    #viewer.fit-mode { padding: 14px 12px; }
    #viewer.single .page-wrap { display: none; }
    #viewer.single .page-wrap.active-page { display: block; margin: 0 auto; }
    #viewer.stamp-mode { cursor: grabbing; }
    #pages { position: relative; display: inline-block; text-align: center; margin: 0 auto;
      max-width: 100%; align-self: center; }
    .page-wrap { position: relative; margin: 0 auto 16px; display: block; width: fit-content;
      box-shadow: 0 1px 4px #0002; border-radius: 2px; overflow: hidden; background: #fff; }
    #pageHud {
      position: absolute; right: 16px; bottom: 16px; z-index: 45;
      display: none; flex-direction: column; gap: 4px;
      background: #F5F5F5; border: 1px solid #D6D6D6; border-radius: 4px; padding: 4px;
      box-shadow: 0 2px 8px #0002; }
    #pageHud button {
      width: 32px; height: 28px; border: 0; background: transparent; color: #2C2C2C;
      cursor: pointer; border-radius: 3px; font: 700 13px "Segoe UI", sans-serif; }
    #pageHud button:hover { background: #E8F2FF; }
    html.canvas-only #toolbar,
    html.canvas-only #pageHud { display: none !important; }
    html.slim-chrome #toolbar,
    html.slim-chrome #banner,
    html.slim-chrome #pageHud { display: none !important; }
    html.canvas-only.no-thumbs #thumbs { display: none !important; }
    html.canvas-only #main { flex: 1; height: 100%; min-height: 0; }
    html.canvas-only, html.canvas-only body { background: #E8E8E8; }
    .page-wrap canvas { display: block; }
    /* Selectable text (Ctrl+C in the peek). Transparent glyphs over the canvas, same geometry as pdf.js. */
    .textLayer { position: absolute; left: 0; top: 0; right: 0; bottom: 0; overflow: clip; opacity: 1;
      line-height: 1; text-align: initial; text-size-adjust: none; forced-color-adjust: none;
      transform-origin: 0 0; z-index: 2; pointer-events: none; }
    html.slim-chrome .textLayer { pointer-events: auto; }
    #viewer.fill-mode .textLayer, #viewer.stamp-mode .textLayer { pointer-events: none; }
    .textLayer :is(span, br) { color: transparent; position: absolute; white-space: pre;
      cursor: text; transform-origin: 0% 0%; }
    .textLayer ::selection { background: rgba(0, 100, 255, 0.35); }
    .textLayer .markedContent { top: 0; height: 0; }
    .annotationLayer {
      position: absolute; left: 0; top: 0; right: auto; bottom: auto;
      pointer-events: none; transform-origin: 0 0; z-index: 18;
      --annotation-unfocused-field-background: rgba(0, 54, 255, 0.13);
      --input-focus-border-color: #2b6cb0;
      --input-focus-outline: 1px solid #fff;
      --input-unfocused-border-color: transparent;
      --input-disabled-border-color: transparent;
      --input-hover-border-color: #10141a;
    }
    .annotationLayer section {
      position: absolute; text-align: initial; pointer-events: none;
      box-sizing: border-box; transform-origin: 0 0;
    }
    /* pdf.js AnnotationLayer positions sections in % of pageWidth * --scale-factor.
       Missing these rules made AcroForm widgets drift / fly on zoom+scroll. */
    .annotationLayer :is(.linkAnnotation, .buttonWidgetAnnotation.pushButton) > a {
      position: absolute; left: 0; top: 0; width: 100%; height: 100%;
    }
    /* Layer stays none so empty page still receives drag-draw. Only the widget
       sections capture clicks (type native fields). Auto-on-layer ate every
       Fill bounding-box drag on AcroForm PDFs (EP FORM, 158 widgets). */
    #viewer.fill-mode .annotationLayer { pointer-events: none; }
    #viewer.fill-mode .annotationLayer section { pointer-events: auto; }
    .annotationLayer .textWidgetAnnotation :is(input, textarea),
    .annotationLayer .choiceWidgetAnnotation select,
    .annotationLayer .buttonWidgetAnnotation:is(.checkBox, .radioButton) input {
      background-image: var(--annotation-unfocused-field-background);
      background-color: rgba(255,255,255,0.55);
      border: 1.5px solid rgba(43,108,176,0.7);
      box-sizing: border-box; color: #10141a;
      font: calc(10px * var(--scale-factor, 1)) Helvetica, Arial, sans-serif;
      height: 100%; width: 100%; margin: 0; vertical-align: top;
      padding-inline: calc(2px * var(--scale-factor, 1));
    }
    .annotationLayer .textWidgetAnnotation textarea { resize: none; }
    .annotationLayer .buttonWidgetAnnotation.radioButton input { border-radius: 50%; }
    .annotationLayer .textWidgetAnnotation :is(input, textarea):focus,
    .annotationLayer .choiceWidgetAnnotation select:focus {
      outline: var(--input-focus-outline); outline-offset: -1px;
      border: 2px solid var(--input-focus-border-color); background: #fff;
    }
    .annotationLayer .linkAnnotation { display: none; }
    #stampGhost { position: absolute; pointer-events: none; display: none; z-index: 40;
      filter: drop-shadow(0 4px 12px #0008); opacity: 0.98; }
    #stampGhost img { max-width: 180px; max-height: 70px; display: block; }
    .stamp-overlay { position: absolute; z-index: 30; box-sizing: border-box;
      border: 2px solid #0B5CAB; background: #fffffff0; cursor: move;
      border-radius: 2px; box-shadow: 0 0 0 1px #0e121866, 0 2px 8px #0003; }
    .stamp-overlay img { width: 100%; height: 100%; object-fit: contain; pointer-events: none; display: block; opacity: 1; }
    .stamp-overlay .handle { position: absolute; width: 10px; height: 10px; background: #0B5CAB;
      border: 1px solid #0e1218; border-radius: 2px; right: -5px; bottom: -5px; cursor: nwse-resize; }
    .stamp-overlay.committed { border-color: #2a9a8e; background: #fffffff5; }
    .stamp-overlay.selected { border-color: #ffd64a; z-index: 35; background: #fffffff8; }
    /* Acrobat Fill & Sign-style floating bar (A− / A+ / trash) */
    #stampFloatBar {
      display: none; position: fixed; z-index: 80; gap: 2px; align-items: center;
      background: #2b6cb0; border-radius: 4px; padding: 3px 4px;
      box-shadow: 0 2px 10px #0006; pointer-events: auto; }
    #stampFloatBar button {
      background: transparent; color: #fff; border: 0; border-radius: 3px;
      width: 28px; height: 26px; cursor: pointer; font: 700 13px "Segoe UI", sans-serif;
      line-height: 1; padding: 0; }
    #stampFloatBar button:hover { background: rgba(255,255,255,0.18); }
    #stampFloatBar button.sm { font-size: 11px; }
    #stampFloatBar button.lg { font-size: 16px; }
    #stampFloatBar button.trash { font-size: 14px; }
    /* Fill & Sign typed-text boxes (Acrobat blue) */
    #viewer.fill-mode { cursor: text; }
    .fill-text { position: absolute; z-index: 32; box-sizing: border-box;
      border: 1.5px solid #2b6cb0; background: rgba(219, 234, 254, 0.30);
      color: #10141a; font-family: Helvetica, Arial, "Segoe UI", sans-serif;
      padding: 0; outline: none; cursor: text; white-space: pre;
      overflow: visible; border-radius: 2px; user-select: text; }
    .fill-text .fill-inner {
      display: block; width: 100%; height: 100%; box-sizing: border-box;
      padding: 0 3px; outline: none; overflow: hidden; }
    .fill-text.active { border-color: #1a56a8; background: rgba(219, 234, 254, 0.45);
      box-shadow: 0 0 0 1px #2b6cb055, 0 4px 14px #0004; }
    .fill-text .handle { position: absolute; width: 10px; height: 10px; background: #2b6cb0;
      border: 1px solid #0e1218; border-radius: 2px; right: -5px; bottom: -5px; cursor: nwse-resize;
      z-index: 2; }
    #fillDrawGhost { position: absolute; z-index: 34; pointer-events: none; display: none;
      border: 1.5px dashed #2b6cb0; background: rgba(43, 108, 176, 0.12); border-radius: 2px; }
    .fill-cell-flash { position: absolute; z-index: 28; pointer-events: none;
      background: rgba(43, 108, 176, 0.18); border: 1.5px solid #2b6cb0;
      border-radius: 2px; transition: opacity 0.45s ease; }
    #fillFloatBar {
      display: none; position: fixed; z-index: 80; gap: 2px; align-items: center;
      background: #2b6cb0; border-radius: 4px; padding: 3px 4px;
      box-shadow: 0 2px 10px #0006; pointer-events: auto; }
    #fillFloatBar button {
      background: transparent; color: #fff; border: 0; border-radius: 3px;
      width: 28px; height: 26px; cursor: pointer; font: 700 13px "Segoe UI", sans-serif;
      line-height: 1; padding: 0; }
    #fillFloatBar button:hover { background: rgba(255,255,255,0.18); }
    #fillFloatBar button.sm { font-size: 11px; }
    #fillFloatBar button.lg { font-size: 16px; }
    #fillFloatBar button.trash { font-size: 14px; }
    .hl-layer { position: absolute; left: 0; top: 0; right: 0; bottom: 0; pointer-events: none; z-index: 12; }
    .hl-box { position: absolute; background: rgba(255, 214, 74, 0.42); border: 1.5px solid rgba(255, 196, 40, 0.9);
      border-radius: 3px; mix-blend-mode: multiply; }
    .hl-box.mark { background: rgba(11, 92, 171, 0.28); border-color: rgba(11, 92, 171, 0.95); }
    /* Region marquee — Word-style "select area", crops + parses before AI */
    .region-layer { position: absolute; left: 0; top: 0; right: 0; bottom: 0; pointer-events: none; z-index: 13; }
    .region-box { position: absolute; background: rgba(11, 92, 171, 0.12);
      border: 1.6px dashed rgba(11, 92, 171, 0.95); border-radius: 2px; box-sizing: border-box;
      box-shadow: 0 2px 8px rgba(8, 12, 18, 0.2); }
    .search-hit { position: absolute; background: rgba(11, 92, 171, 0.28);
      border: 1.5px solid rgba(11, 92, 171, 0.95); border-radius: 2px; box-sizing: border-box;
      pointer-events: none; z-index: 14; }
    .search-hit.current { background: rgba(255, 214, 74, 0.55); border-color: #ffd64a; }
    /* Overlay, never in-flow: toggling the banner must not shift the pages
       under the cursor (Acrobat's hint bar overlays the document too). */
    #banner { display: none; position: absolute; left: 50%; top: 12px; transform: translateX(-50%);
      background: #E8F2FF; color: #2C2C2C; padding: 8px 14px; border-radius: 4px;
      font-weight: 700; z-index: 50; box-shadow: 0 2px 8px #0002; white-space: nowrap;
      width: fit-content; border: 1px solid #D6E8F8; }
    #status { margin-left: auto; opacity: 1; font-size: 12px; font-weight: 600; color: var(--doc-muted, #a8b0c0);
      max-width: 340px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .bbox { position: absolute; border: 1px solid #0B5CAB88; background: #0B5CAB22;
      border-radius: 1px; pointer-events: auto; cursor: pointer; z-index: 15; }
    .bbox.selected { border-color: #ffd64a; background: #ffd64a33; }
  </style>
</head>
<body>
  <div id="toolbar">
    <button id="prev" title="Previous page">
      <svg viewBox="0 0 18 18" aria-hidden="true"><path d="M11.2 4.2 L6.4 9 l4.8 4.8" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span class="lbl">Prev</span>
    </button>
    <input id="pageInput" type="number" min="1" value="1" title="Type page number, Enter to go"/>
    <span id="pageTotal">/ 1</span>
    <button id="next" title="Next page">
      <svg viewBox="0 0 18 18" aria-hidden="true"><path d="M6.8 4.2 L11.6 9 l-4.8 4.8" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span class="lbl">Next</span>
    </button>
    <button id="modeBtn" title="Toggle one page / continuous scroll">
      <svg viewBox="0 0 18 18" aria-hidden="true"><rect x="4" y="3" width="10" height="12" rx="1" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M7 7 h4 M7 11 h4" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
      <span class="lbl">Continuous</span>
    </button>
    <span class="sep" aria-hidden="true"></span>
    <button id="zoomOut" title="Zoom out">
      <svg viewBox="0 0 18 18" aria-hidden="true"><path d="M4 9 h10" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
      <span class="lbl">-</span>
    </button>
    <span id="zoomLabel">100%</span>
    <button id="zoomIn" title="Zoom in">
      <svg viewBox="0 0 18 18" aria-hidden="true"><path d="M9 4 v10 M4 9 h10" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
      <span class="lbl">+</span>
    </button>
    <button id="fit" title="Fit page to window (sharp, no stretch)">
      <svg viewBox="0 0 18 18" aria-hidden="true"><path d="M4 7 V4 h3 M14 7 V4 h-3 M4 11 v3 h3 M14 11 v3 h-3" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span class="lbl">Fit</span>
    </button>
    <span class="sep" aria-hidden="true"></span>
    <button id="stampBtn" class="accent" title="Cancel signature placement">
      <span class="lbl">Cancel placement</span>
    </button>
    <button id="stampConfirmBtn" class="accent hot" style="display:none" title="Legacy — auto-kept on drop">Keep stamp</button>
    <button id="fillBtn" title="Fill &amp; type — click a table cell or line, then type">
      <svg viewBox="0 0 18 18" aria-hidden="true"><path d="M4 14.5 h10 M6 12.5 L12.2 6.3 l1.5 1.5 L7.5 14" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span class="lbl">Fill</span>
    </button>
    <button id="hlBtn" title="Drag across text to highlight — Save writes it into the PDF">
      <svg viewBox="0 0 18 18" aria-hidden="true"><path d="M4 13 h10 M5.5 13 L8 5 h2 l2.5 8" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M7.2 10 h3.6" fill="none" stroke="currentColor" stroke-width="1.5"/></svg>
      <span class="lbl">Highlight</span>
    </button>
    <button id="markBtn" title="Drag to draw a mark — Save writes it into the PDF">
      <svg viewBox="0 0 18 18" aria-hidden="true"><path d="M4 13.5 l7-9 3 2.4-7 9 H4 z" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></svg>
      <span class="lbl">Mark</span>
    </button>
    <button id="regionBtn" title="Select area — drag a box over a table or figure to send it to chat">
      <svg viewBox="0 0 18 18" aria-hidden="true"><rect x="4" y="4" width="10" height="10" rx="1" fill="none" stroke="currentColor" stroke-width="1.5" stroke-dasharray="2 2"/></svg>
      <span class="lbl">Area</span>
    </button>
    <span class="sep" aria-hidden="true"></span>
    <div id="searchWrap">
      <button id="searchToggle" title="Search text in document">
        <svg viewBox="0 0 18 18" aria-hidden="true"><circle cx="8" cy="8" r="4.2" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M11.2 11.2 L14.5 14.5" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
        <span class="lbl">Search</span>
      </button>
      <div id="searchPanel">
        <input id="searchBox" type="search" placeholder="Find in PDF…" title="Search all text · Enter"/>
        <button id="searchPrev" title="Previous match">↑</button>
        <button id="searchNext" title="Next match">↓</button>
      </div>
    </div>
    <span id="status">Loading…</span>
  </div>
  <div id="main">
    <div id="thumbs"></div>
    <div id="viewer">
      <div id="banner">Drag signature onto the page — release to place, then drag the box</div>
      <div id="pages"></div>
      <div id="stampGhost"><img id="stampImg" alt="signature"/></div>
    </div>
    <div id="pageHud" aria-label="Page controls">
      <button type="button" id="hudPrev" title="Previous page">▲</button>
      <button type="button" id="hudNext" title="Next page">▼</button>
      <button type="button" id="hudZoomOut" title="Zoom out">-</button>
      <button type="button" id="hudZoomIn" title="Zoom in">+</button>
    </div>
  </div>
  <div id="stampFloatBar" title="Resize or delete signature">
    <button type="button" class="sm" id="stampSizeDown" title="Smaller">A</button>
    <button type="button" class="lg" id="stampSizeUp" title="Larger">A</button>
    <button type="button" class="trash" id="stampDeleteBtn" title="Delete">✕</button>
  </div>
  <div id="fillFloatBar" title="Resize text or delete box">
    <button type="button" class="sm" id="fillSizeDown" title="Smaller text">A</button>
    <button type="button" class="lg" id="fillSizeUp" title="Larger text">A</button>
    <button type="button" class="trash" id="fillDeleteBtn" title="Delete text box">🗑</button>
  </div>
  <div id="fillDrawGhost" aria-hidden="true"></div>
  <script type="module">
    import * as pdfjsLib from './build/pdf.mjs';
    pdfjsLib.GlobalWorkerOptions.workerSrc = new URL('./build/pdf.worker.mjs', import.meta.url).href;

    const params = new URLSearchParams(location.search);
    let fileUrl = params.get('file') || '';
    let pdf = null;
    let pageNum = 1;
    let scale = 1.25;
    let fitMode = false;
    let stampMode = false;
    let stampPending = false;
    let highlightMode = false;
    let markupKind = 'highlight'; // 'highlight' | 'mark'
    let bboxMode = false;
    /** @type {{id:string,page:number,xPt:number,yFromBottom:number,wPt:number,hPt:number,kind:string,el:HTMLElement|null}[]} */
    let highlights = [];
    let stampDataUrl = null;
    let dragging = false;
    let lastPointer = null;
    let pendingPlacement = null;
    let pendingOverlay = null;
    let boxDrag = null;
    let loadGen = 0;
    let formFields = [];
    let fillMode = false;
    let regionMode = false;
    /** @type {{id:string,page:number,xPt:number,yFromBottom:number,wPt:number,hPt:number,fontPt:number,text:string,snapped:string,el:HTMLElement|null}[]} */
    let fillFields = [];
    let activeFillId = null;
    let fillPostTimer = 0;
    /** @type {{page:number,entry:any,x0:number,y0:number,x1:number,y1:number}|null} */
    let fillDraw = null;
    /** @type {{id:string,ox:number,oy:number,wPt:number,hPt:number,xPt:number,yFromBottom:number}|null} */
    let fillResize = null;
    let fillDrawSuppressClick = false;
    /** @type {{id:string,page:number,xPt:number,yFromBottom:number,stampW:number,stampH:number,dataUrl:string,el:HTMLElement}[]} */
    let overlays = [];
    /** @type {Map<number,{wrap:HTMLElement,canvas:HTMLCanvasElement,widthPt:number,heightPt:number,rendered:boolean}>} */
    const pageMap = new Map();
    const STAMP_MAX_WIDTH_PT = 160;
    const SNAP_RADIUS_PT = 40;
    let continuous = true;
    let searchHits = []; // {page, x, y, w, h} in PDF points
    let searchIdx = -1;
    let searchQuery = '';
    const THUMB_BATCH = 12; // was 48 — 4x fewer thumb rasters on open (low-RAM PCs)
    let thumbCursor = 0;
    const dpr = () => Math.min(1.5, window.devicePixelRatio || 1); // cap for lag on low-RAM PCs

    const thumbs = document.getElementById('thumbs');
    const viewer = document.getElementById('viewer');
    const pagesEl = document.getElementById('pages');
    const status = document.getElementById('status');
    const stampGhost = document.getElementById('stampGhost');
    const stampImg = document.getElementById('stampImg');
    const stampFloatBar = document.getElementById('stampFloatBar');
    const banner = document.getElementById('banner');
    const stampBtn = document.getElementById('stampBtn');
    const stampConfirmBtn = document.getElementById('stampConfirmBtn');
    const pageInput = document.getElementById('pageInput');
    const pageTotal = document.getElementById('pageTotal');

    function post(msg) {
      if (window.__netie) window.__netie.sent.push(typeof msg === 'string' ? { raw: msg } : msg);
      try {
        window.chrome?.webview?.postMessage(typeof msg === 'string' ? msg : JSON.stringify(msg));
      } catch (_) {}
    }

    function uid() { return 's' + Math.random().toString(36).slice(2, 10); }

    const netieLinkService = {
      eventBus: null,
      externalLinkEnabled: true,
      externalLinkTarget: 0,
      externalLinkRel: 'noopener noreferrer nofollow',
      get pagesCount() { return pdf ? pdf.numPages : 0; },
      get page() { return pageNum; },
      set page(n) { goToPage(n, true); },
      rotation: 0,
      addLinkAttributes(el, url) {
        if (!el || !url) return;
        el.href = url;
        el.target = '_blank';
        el.rel = this.externalLinkRel;
      },
      getDestinationHash() { return '#'; },
      getAnchorUrl(h) { return h || '#'; },
      executeNamedAction() {},
      executeSetOCGState() {},
      goToDestination() { return Promise.resolve(); },
      goToPage(n) { goToPage(n, true); },
      isPageVisible() { return true; },
      isPageCached() { return true; }
    };

    function u8ToB64(u8) {
      const chunk = 0x8000;
      let s = '';
      for (let i = 0; i < u8.length; i += chunk)
        s += String.fromCharCode.apply(null, u8.subarray(i, i + chunk));
      return btoa(s);
    }

    /** Selection + nearby tokens + page for Netie Look Up (host calls via ExecuteScript). */
    window.netieGetLookupContext = function (radius) {
      const r = Math.max(40, Math.min(200, radius | 0 || 100));
      let word = '';
      try { word = (window.getSelection && window.getSelection().toString()) || ''; } catch (_) {}
      word = (word || '').trim();
      let page = pageNum || 1;
      let pageText = '';
      try {
        const sel = window.getSelection && window.getSelection();
        const node = sel && sel.anchorNode;
        const wrap = node && (node.nodeType === 1 ? node : node.parentElement)?.closest?.('.page-wrap');
        if (wrap) {
          const n = parseInt(wrap.dataset.page || wrap.getAttribute('data-page') || '0', 10);
          if (n > 0) page = n;
          const layer = wrap.querySelector('.textLayer') || wrap;
          pageText = (layer.innerText || layer.textContent || '').replace(/\s+/g, ' ').trim();
        }
      } catch (_) {}
      if (!pageText && pageMap.has(page)) {
        try {
          const entry = pageMap.get(page);
          const layer = entry?.wrap?.querySelector?.('.textLayer') || entry?.wrap;
          pageText = (layer?.innerText || layer?.textContent || '').replace(/\s+/g, ' ').trim();
        } catch (_) {}
      }
      // Canvas-only PDF: use last search/extract cache if present
      if (!pageText && window.__netiePageText && window.__netiePageText[page])
        pageText = window.__netiePageText[page];
      let nearby = '';
      if (word && pageText) {
        const lower = pageText.toLowerCase();
        const needle = word.toLowerCase();
        let idx = lower.indexOf(needle);
        if (idx < 0 && needle.length >= 4) {
          const tokens = pageText.split(/\s+/);
          let best = -1, bestDist = 99, bestIdx = -1;
          let cursor = 0;
          for (let i = 0; i < tokens.length; i++) {
            const t = tokens[i];
            const pos = pageText.indexOf(t, cursor);
            const dist = typeof levenshtein === 'function' ? levenshtein(t.toLowerCase(), needle) : 99;
            const maxDist = Math.min(2, Math.floor(Math.max(needle.length, t.length) * 0.25));
            if (dist <= maxDist && dist < bestDist) {
              bestDist = dist; best = i; bestIdx = pos >= 0 ? pos : bestIdx;
            }
            if (pos >= 0) cursor = pos + t.length;
          }
          if (bestIdx >= 0) idx = bestIdx;
          else if (best >= 0)
            idx = pageText.toLowerCase().indexOf(tokens[best].toLowerCase());
        }
        if (idx >= 0) {
          const start = Math.max(0, idx - r);
          const end = Math.min(pageText.length, idx + word.length + r);
          nearby = pageText.slice(start, end).trim();
        }
      }
      if (!nearby && pageText)
        nearby = pageText.slice(0, Math.min(pageText.length, r * 2)).trim();
      return JSON.stringify({
        word: word,
        page: page,
        nearby: nearby,
        location: 'page ' + page
      });
    };

    /** Async enrich: pull pdf.js text for current page into cache, then return lookup context. */
    window.netieGetLookupContextAsync = async function (radius, fallbackWord) {
      const page = pageNum || 1;
      try {
        if (pdf && (!window.__netiePageText || !window.__netiePageText[page])) {
          window.__netiePageText = window.__netiePageText || {};
          const p = await pdf.getPage(page);
          const tc = await p.getTextContent();
          window.__netiePageText[page] = (tc.items || []).map(i => i.str || '').join(' ').replace(/\s+/g, ' ').trim();
        }
      } catch (_) {}
      let raw = window.netieGetLookupContext(radius);
      try {
        const obj = JSON.parse(raw);
        if ((!obj.word || !obj.word.trim()) && fallbackWord)
          obj.word = String(fallbackWord).trim();
        if (obj.word && (!obj.nearby || !obj.nearby.trim()) && window.__netiePageText?.[page]) {
          const pageText = window.__netiePageText[page];
          const r = Math.max(40, Math.min(200, radius | 0 || 100));
          const needle = obj.word.toLowerCase();
          let idx = pageText.toLowerCase().indexOf(needle);
          if (idx < 0 && needle.length >= 4) {
            const tokens = pageText.split(/\s+/);
            for (const t of tokens) {
              if (typeof strictTokenMatch === 'function' && strictTokenMatch(t, needle)) {
                idx = pageText.toLowerCase().indexOf(t.toLowerCase());
                break;
              }
            }
          }
          if (idx >= 0) {
            obj.nearby = pageText.slice(Math.max(0, idx - r), Math.min(pageText.length, idx + obj.word.length + r)).trim();
          } else {
            obj.nearby = pageText.slice(0, Math.min(pageText.length, r * 2)).trim();
          }
          obj.page = page;
          obj.location = 'page ' + page;
        }
        return JSON.stringify(obj);
      } catch (_) {
        return raw;
      }
    };

    async function load() {
      if (!fileUrl) { status.textContent = 'No file'; return; }
      const myLoad = ++loadGen;
      status.textContent = 'Opening…';
      // Cancel in-flight page renders before swapping documents
      for (const e of pageMap.values()) { try { e.renderTask?.cancel(); } catch (_) {} }
      const oldPdf = pdf;
      const newPdf = await pdfjsLib.getDocument({
        url: fileUrl,
        annotationMode: pdfjsLib.AnnotationMode.ENABLE_FORMS
      }).promise;
      newPdf.annotationStorage.onSetModified = () => {
        if (!fillMode) return;
        post({ type: 'acroFormDirty' });
      };
      if (myLoad !== loadGen) { try { newPdf.destroy(); } catch (_) {} return; }
      pdf = newPdf;
      if (oldPdf) { try { oldPdf.destroy(); } catch (_) {} }
      // Reload (autosave, organize, …) must not steal the reading position
      const returnTo = Math.min(Math.max(1, pageNum || 1), pdf.numPages);
      pageNum = returnTo;
      pageInput.max = String(pdf.numPages);
      pageInput.value = String(returnTo);
      pageTotal.textContent = '/ ' + pdf.numPages;
      thumbCursor = 0;
      thumbs.innerHTML = '';
      await buildPageStack();
      if (myLoad !== loadGen) return;
      await applyFit(false);
      await renderVisiblePages(true);
      if (myLoad !== loadGen) return;
      scrollToPage(returnTo, false);
      // Report ready as soon as the reading page is up — do NOT gate on 48 serial thumbnail
      // rasterizations. Thumbnails fill in afterwards without holding time-to-interactive.
      post({ type: 'ready', pages: pdf.numPages });
      status.textContent = pdf.numPages + ' pages · fit · Continuous scroll on';
      applyViewMode();
      Promise.resolve().then(() => { if (myLoad === loadGen) renderThumbBatch(); });
    }

    function applyViewMode() {
      const keep = pageNum;
      viewer.classList.toggle('single', !continuous);
      const modeBtn = document.getElementById('modeBtn');
      if (modeBtn) {
        const lbl = modeBtn.querySelector('.lbl');
        const text = continuous ? 'Continuous' : 'One page';
        if (lbl) lbl.textContent = text;
        else modeBtn.textContent = text;
        modeBtn.classList.toggle('on', continuous);
      }
      for (const [n, entry] of pageMap) {
        entry.wrap.classList.toggle('active-page', n === keep);
      }
      // Stay on the page you were reading — never jump to page 1
      pageNum = keep;
      pageInput.value = String(keep);
      goToPage(keep, false);
      status.textContent = continuous
        ? 'Continuous — scroll freely (stayed on page ' + keep + ')'
        : 'One page — stayed on page ' + keep;
    }

    async function buildPageStack() {
      pagesEl.innerHTML = '';
      pageMap.clear();
      // Batch page metrics so large PDFs don't stall on open
      const batch = 12;
      for (let start = 1; start <= pdf.numPages; start += batch) {
        const end = Math.min(pdf.numPages, start + batch - 1);
        const jobs = [];
        for (let i = start; i <= end; i++) {
          jobs.push((async (n) => {
            const page = await pdf.getPage(n);
            const baseVp = page.getViewport({ scale: 1 });
            const wrap = document.createElement('div');
            wrap.className = 'page-wrap';
            wrap.dataset.page = String(n);
            const canvas = document.createElement('canvas');
            // Placeholder CSS size from CSS scale only — buffer filled on render (DPR-sharp)
            const cssW = Math.max(1, Math.floor(baseVp.width * Math.min(scale, 1.0)));
            const cssH = Math.max(1, Math.floor(baseVp.height * Math.min(scale, 1.0)));
            canvas.width = cssW;
            canvas.height = cssH;
            canvas.style.width = cssW + 'px';
            canvas.style.height = cssH + 'px';
            wrap.appendChild(canvas);
            const textDiv = document.createElement('div');
            textDiv.className = 'textLayer';
            wrap.appendChild(textDiv);
            const annotDiv = document.createElement('div');
            annotDiv.className = 'annotationLayer';
            wrap.appendChild(annotDiv);
            return { n, wrap, canvas, textDiv, annotDiv, widthPt: baseVp.width, heightPt: baseVp.height };
          })(i));
        }
        const chunk = await Promise.all(jobs);
        chunk.sort((a, b) => a.n - b.n);
        for (const item of chunk) {
          pagesEl.appendChild(item.wrap);
          pageMap.set(item.n, {
            wrap: item.wrap, canvas: item.canvas, textDiv: item.textDiv, annotDiv: item.annotDiv,
            widthPt: item.widthPt, heightPt: item.heightPt, rendered: false
          });
        }
      }
    }

    async function renderPageAt(n, force) {
      const entry = pageMap.get(n);
      if (!entry || !pdf) return;
      if (entry.rendered && !force) return;
      // Per-page generation + task handle: concurrent calls must never race one
      // canvas ("Cannot use the same canvas during multiple render() operations"
      // used to kill load()/reload and leave stale pixels on screen).
      const myGen = entry.gen = (entry.gen || 0) + 1;
      const myLoad = loadGen;
      if (entry.renderTask) {
        try { entry.renderTask.cancel(); } catch (_) {}
        try { await entry.renderTask.promise; } catch (_) {}
      }
      if (myGen !== entry.gen || myLoad !== loadGen || !pdf) return;
      const page = await pdf.getPage(n);
      if (myGen !== entry.gen || myLoad !== loadGen) return;
      // Acrobat-style fit: CSS scale for layout; render buffer at scale×DPR so pixels stay sharp
      const cssScale = Math.min(4, Math.max(0.25, scale));
      const pixelScale = cssScale * dpr();
      const cssVp = page.getViewport({ scale: cssScale });
      const renderVp = page.getViewport({ scale: pixelScale });
      let w = Math.floor(renderVp.width), h = Math.floor(renderVp.height);
      const maxPx = 4096 * 4096;
      if (w * h > maxPx) {
        const f = Math.sqrt(maxPx / (w * h));
        w = Math.floor(w * f);
        h = Math.floor(h * f);
      }
      entry.canvas.width = w;
      entry.canvas.height = h;
      entry.canvas.style.width = Math.floor(cssVp.width) + 'px';
      entry.canvas.style.height = Math.floor(cssVp.height) + 'px';
      const ctx = entry.canvas.getContext('2d');
      const finalVp = page.getViewport({ scale: pixelScale * (w / renderVp.width) });
      const task = page.render({
        canvasContext: ctx,
        viewport: finalVp,
        annotationMode: pdfjsLib.AnnotationMode.ENABLE_FORMS
      });
      entry.renderTask = task;
      try {
        await task.promise;
      } catch (e) {
        if (entry.renderTask === task) entry.renderTask = null;
        if (e?.name === 'RenderingCancelledException' || /destroyed/i.test(String(e?.message || ''))) return;
        throw e;
      }
      if (entry.renderTask === task) entry.renderTask = null;
      if (myGen !== entry.gen || myLoad !== loadGen) return;
      entry.rendered = true;
      renderSelectableText(entry, page, cssVp, myGen);
      await renderAnnotLayer(entry, page, cssVp);

      layoutHighlightsForPage(n);
      layoutOverlaysForPage(n);
      layoutFillFieldsForPage(n);
      paintSearchHitsForPage(n);
    }

    // Text layer: not awaited, so selecting text never delays the picture or the page indicator.
    async function renderSelectableText(entry, page, cssVp, gen) {
      if (!entry?.textDiv || typeof pdfjsLib.TextLayer !== 'function') return;
      try {
        entry.textDiv.replaceChildren();
        entry.wrap.style.setProperty('--scale-factor', String(cssVp.scale || 1));
        entry.textDiv.style.setProperty('--scale-factor', String(cssVp.scale || 1));
        const layer = new pdfjsLib.TextLayer({
          textContentSource: page.streamTextContent(),
          container: entry.textDiv,
          viewport: cssVp
        });
        await layer.render();
        if (gen !== entry.gen) entry.textDiv.replaceChildren();
      } catch (_) { /* a page without text simply has nothing to select */ }
    }

    async function renderAnnotLayer(entry, page, cssVp) {
      if (!entry?.annotDiv || !pdf) return;
      entry.annotDiv.replaceChildren();
      let annotations;
      try { annotations = await page.getAnnotations({ intent: 'display' }); }
      catch (_) { return; }
      if (!annotations.length) {
        entry.annotDiv.hidden = true;
        return;
      }
      entry.annotDiv.hidden = false;
      // pdf.js sizes the layer as calc(var(--scale-factor) * pageWidth).
      // Hardcoding 1 left widgets in the top-left of a zoomed canvas.
      const cssScale = cssVp.scale || 1;
      entry.wrap.style.setProperty('--scale-factor', String(cssScale));
      entry.annotDiv.style.setProperty('--scale-factor', String(cssScale));
      const vp = cssVp.clone({ dontFlip: true });
      try {
        const layer = new pdfjsLib.AnnotationLayer({
          div: entry.annotDiv,
          page,
          viewport: vp
        });
        await layer.render({
          annotations,
          viewport: vp,
          linkService: netieLinkService,
          renderForms: true,
          annotationStorage: pdf.annotationStorage,
          downloadManager: null,
          enableScripting: false
        });
      } catch (e) {
        try { console.warn('annot layer', e); } catch (_) {}
      }
      entry.annotDiv.style.width = entry.canvas.style.width;
      entry.annotDiv.style.height = entry.canvas.style.height;
      entry.annotDiv.style.left = '0';
      entry.annotDiv.style.top = '0';
    }

    async function renderVisiblePages(forceAllNear) {
      if (!pdf) return;
      const vr = viewer.getBoundingClientRect();
      const tasks = [];
      for (const [n, entry] of pageMap) {
        const r = entry.wrap.getBoundingClientRect();
        const near = r.bottom >= vr.top - 400 && r.top <= vr.bottom + 400;
        if (near || (forceAllNear && Math.abs(n - pageNum) <= 1))
          tasks.push(renderPageAt(n, false));
      }
      await Promise.all(tasks);
      document.getElementById('zoomLabel').textContent = Math.round(scale * 100) + '%';
      syncPageFromScroll();
    }

    async function renderThumbBatch() {
      if (!pdf) return;
      const hide = document.documentElement.classList.contains('no-thumbs');
      const end = Math.min(pdf.numPages, thumbCursor + THUMB_BATCH);
      for (let i = thumbCursor + 1; i <= end; i++) {
        const page = await pdf.getPage(i);
        const vp = page.getViewport({ scale: 0.18 });
        const c = document.createElement('canvas');
        c.width = vp.width; c.height = vp.height;
        c.dataset.page = String(i);
        if (i === pageNum) c.classList.add('active');
        await page.render({ canvasContext: c.getContext('2d'), viewport: vp }).promise;
        c.onclick = () => goToPage(i, true);
        if (hide) {
          try { post({ type: 'thumb', page: i, dataUrl: c.toDataURL('image/jpeg', 0.72) }); } catch (_) {}
        } else {
          const item = document.createElement('div');
          item.className = 'thumb-item' + (i === pageNum ? ' active' : '');
          const num = document.createElement('span');
          num.className = 'thumb-num';
          num.textContent = String(i);
          item.appendChild(c);
          item.appendChild(num);
          thumbs.appendChild(item);
        }
      }
      thumbCursor = end;
      const remaining = Math.max(0, pdf.numPages - thumbCursor);
      if (hide) {
        post({ type: 'thumbMore', remaining });
      } else if (remaining) {
        const more = document.createElement('button');
        more.className = 'thumb-more';
        more.textContent = 'Load more… (+' + remaining + ')';
        more.onclick = async () => { more.remove(); await renderThumbBatch(); };
        thumbs.appendChild(more);
      }
    }

    function dumpThumbsToHost() {
      if (!pdf) return;
      thumbs.querySelectorAll('canvas[data-page]').forEach(c => {
        try {
          post({ type: 'thumb', page: +c.dataset.page, dataUrl: c.toDataURL('image/jpeg', 0.72) });
        } catch (_) {}
      });
      post({ type: 'thumbMore', remaining: Math.max(0, pdf.numPages - thumbCursor) });
    }

    function levenshtein(a, b) {
      if (a === b) return 0;
      if (!a.length) return b.length;
      if (!b.length) return a.length;
      const row = new Array(b.length + 1);
      for (let j = 0; j <= b.length; j++) row[j] = j;
      for (let i = 1; i <= a.length; i++) {
        let prev = i - 1, cur = i;
        for (let j = 1; j <= b.length; j++) {
          const next = row[j];
          const cost = a[i - 1] === b[j - 1] ? 0 : 1;
          row[j] = Math.min(row[j] + 1, cur + 1, prev + cost);
          prev = next;
          cur = row[j];
        }
      }
      return row[b.length];
    }

    /** Strict typo match: never match short substrings inside unrelated words. */
    function strictTokenMatch(word, needle) {
      word = (word || '').toLowerCase();
      needle = (needle || '').toLowerCase();
      if (!needle || needle.length < 2) return false;
      if (word === needle) return true;
      if (needle.length >= 4 && word.includes(needle)) return true;
      if (needle.length < 4) return false;
      const maxDist = Math.min(2, Math.floor(needle.length * 0.2));
      if (maxDist < 1) return false;
      if (Math.abs(word.length - needle.length) > maxDist) return false;
      return levenshtein(word, needle) <= maxDist;
    }

    function clearSearchHitEls() {
      for (const entry of pageMap.values())
        entry.wrap.querySelectorAll('.search-hit').forEach(n => n.remove());
    }

    /** Stable page CSS box — never use getBoundingClientRect for overlay glue (scroll drift). */
    function pageCssBox(entry) {
      const cssW = entry.canvas.clientWidth || entry.canvas.width || 1;
      const cssH = entry.canvas.clientHeight || entry.canvas.height || 1;
      const ox = entry.canvas.offsetLeft || 0;
      const oy = entry.canvas.offsetTop || 0;
      return { cssW, cssH, ox, oy };
    }

    function paintSearchHitsForPage(n) {
      const entry = pageMap.get(n);
      if (!entry) return;
      entry.wrap.querySelectorAll('.search-hit').forEach(el => el.remove());
      const { cssW, cssH, ox, oy } = pageCssBox(entry);
      searchHits.forEach((hit, i) => {
        if (hit.page !== n) return;
        const el = document.createElement('div');
        el.className = 'search-hit' + (i === searchIdx ? ' current' : '');
        el.style.left = (ox + (hit.x / entry.widthPt) * cssW) + 'px';
        el.style.top = (oy + ((entry.heightPt - hit.y - hit.h) / entry.heightPt) * cssH) + 'px';
        el.style.width = Math.max(2, (hit.w / entry.widthPt) * cssW) + 'px';
        el.style.height = Math.max(2, (hit.h / entry.heightPt) * cssH) + 'px';
        entry.wrap.appendChild(el);
      });
    }

    function paintAllSearchHits() {
      const pages = new Set(searchHits.map(h => h.page));
      for (const n of pages) paintSearchHitsForPage(n);
    }

    function ensureHlLayer(entry) {
      let layer = entry.wrap.querySelector('.hl-layer');
      if (!layer) {
        layer = document.createElement('div');
        layer.className = 'hl-layer';
        entry.wrap.appendChild(layer);
      }
      return layer;
    }

    /** PDF bottom-left → overlay CSS. Session truth until Save bakes into the file. */
    function layoutHighlight(hl) {
      const entry = pageMap.get(hl.page);
      if (!entry) return;
      const layer = ensureHlLayer(entry);
      if (!hl.el) {
        hl.el = document.createElement('div');
        hl.el.className = 'hl-box' + (hl.kind === 'mark' ? ' mark' : '');
      }
      if (hl.el.parentNode !== layer) layer.appendChild(hl.el);
      const { cssW, cssH, ox, oy } = pageCssBox(entry);
      hl.el.style.left = (ox + (hl.xPt / entry.widthPt) * cssW) + 'px';
      hl.el.style.top = (oy + ((entry.heightPt - hl.yFromBottom - hl.hPt) / entry.heightPt) * cssH) + 'px';
      hl.el.style.width = Math.max(2, (hl.wPt / entry.widthPt) * cssW) + 'px';
      hl.el.style.height = Math.max(2, (hl.hPt / entry.heightPt) * cssH) + 'px';
    }

    function layoutHighlightsForPage(n) {
      for (const hl of highlights.filter(x => x.page === n)) layoutHighlight(hl);
    }

    function layoutAllHighlights() {
      for (const hl of highlights) layoutHighlight(hl);
    }

    function snapshotHighlights() {
      return highlights.map(h => ({
        id: h.id, page: h.page, xPt: h.xPt, yFromBottom: h.yFromBottom,
        wPt: h.wPt, hPt: h.hPt, kind: h.kind || 'highlight', el: null
      }));
    }

    function postHighlights() {
      post({
        type: 'highlights',
        highlights: highlights.map(h => ({
          id: h.id, page: h.page, xPt: h.xPt, yFromBottom: h.yFromBottom,
          wPt: h.wPt, hPt: h.hPt, kind: h.kind || 'highlight',
          pageHeightPt: pageMap.get(h.page)?.heightPt || 0
        }))
      });
    }

    function setMarkupMode(kind) {
      const next = kind === 'mark' ? 'mark' : 'highlight';
      const turningOn = !highlightMode || markupKind !== next;
      highlightMode = turningOn;
      markupKind = next;
      bboxMode = false;
      if (highlightMode) { exitStampMode(); exitFillMode(); setRegionMode(false); }
      document.getElementById('hlBtn')?.classList.toggle('on', highlightMode && markupKind === 'highlight');
      document.getElementById('markBtn')?.classList.toggle('on', highlightMode && markupKind === 'mark');
      status.textContent = highlightMode
        ? (markupKind === 'mark' ? 'Drag to draw a mark — Save writes it into the PDF' : 'Drag across text to highlight — Save writes it into the PDF')
        : '';
    }

    function pushQuad(hits, pageIndex, it, idx, matchLen) {
      const str = it.str || '';
      if (!str || matchLen <= 0) return;
      const tx = it.transform || [1, 0, 0, 1, 0, 0];
      const fontH = Math.hypot(tx[2], tx[3]) || (it.height || 10);
      const fontW = Math.hypot(tx[0], tx[1]) || fontH * 0.5;
      const totalW = (it.width != null) ? it.width : fontW * str.length;
      const charW = str.length > 0 ? totalW / str.length : fontW;
      hits.push({
        page: pageIndex,
        x: tx[4] + charW * idx,
        y: tx[5] - fontH * 0.15,
        w: Math.max(charW * matchLen, 2),
        h: Math.max(fontH * 1.15, 4)
      });
    }

    /** Exact + strict fuzzy quads only — no fake full-page hits. */
    async function findHitsOnPage(pageIndex, needle) {
      const page = await pdf.getPage(pageIndex);
      const tc = await page.getTextContent();
      const hits = [];
      const q = needle.toLowerCase().trim();
      if (!q) return hits;

      // Tier 1: exact substring inside each text item
      for (const it of tc.items) {
        const str = it.str || '';
        if (!str) continue;
        const lower = str.toLowerCase();
        let from = 0;
        while (from < lower.length) {
          const idx = lower.indexOf(q, from);
          if (idx < 0) break;
          pushQuad(hits, pageIndex, it, idx, q.length);
          from = idx + Math.max(1, q.length);
        }
      }
      if (hits.length) return hits;

      // Tier 2: multi-token — every token (≥2 chars) must appear exactly on the page
      const tokens = q.split(/[^a-z0-9\u4e00-\u9fff]+/i).filter(t => t.length >= 2);
      if (tokens.length > 1) {
        const pageLower = tc.items.map(it => (it.str || '').toLowerCase()).join(' ');
        if (tokens.every(t => pageLower.includes(t))) {
          for (const t of tokens) {
            for (const it of tc.items) {
              const lower = (it.str || '').toLowerCase();
              let from = 0;
              while (from < lower.length) {
                const idx = lower.indexOf(t, from);
                if (idx < 0) break;
                pushQuad(hits, pageIndex, it, idx, t.length);
                from = idx + Math.max(1, t.length);
              }
            }
          }
        }
        if (hits.length) return hits;
      }

      // Tier 3: strict edit-distance on whole words (len ≥ 4 only)
      if (q.length >= 4) {
        for (const it of tc.items) {
          const str = it.str || '';
          if (!str) continue;
          const words = str.split(/[^a-z0-9\u4e00-\u9fff]+/i).filter(Boolean);
          let cursor = 0;
          const lower = str.toLowerCase();
          for (const w of words) {
            const wIdx = lower.indexOf(w.toLowerCase(), cursor);
            if (wIdx < 0) continue;
            if (strictTokenMatch(w, q))
              pushQuad(hits, pageIndex, it, wIdx, w.length);
            cursor = wIdx + w.length;
          }
        }
      }
      return hits;
    }

    let searchRun = 0;
    async function runSearch(q) {
      const myRun = ++searchRun;
      clearSearchHitEls();
      searchHits = [];
      searchIdx = -1;
      searchQuery = (q || '').trim();
      if (!searchQuery || !pdf) {
        status.textContent = 'Search cleared';
        post({ type: 'findResult', count: 0, index: -1, done: true });
        return;
      }
      status.textContent = 'Searching…';
      for (let i = 1; i <= pdf.numPages; i++) {
        const pageHits = await findHitsOnPage(i, searchQuery);
        if (myRun !== searchRun) return;   // a newer query took over
        if (pageHits.length) {
          searchHits.push(...pageHits);
          if (searchIdx < 0) {             // first match: go there now, count keeps growing
            searchIdx = 0;
            goToPage(searchHits[0].page, true);
          }
          post({ type: 'findResult', count: searchHits.length, index: searchIdx, done: false });
        }
      }
      if (searchHits.length === 0) {
        status.textContent = 'No matches';
        post({ type: 'findResult', count: 0, index: -1, done: true });
        return;
      }
      paintAllSearchHits();
      status.textContent = 'Match ' + (searchIdx + 1) + '/' + searchHits.length +
        ' · page ' + searchHits[searchIdx].page;
      post({ type: 'findResult', count: searchHits.length, index: searchIdx, done: true });
    }

    function jumpSearch(dir) {
      if (searchHits.length === 0) {
        const box = document.getElementById('searchBox');
        if (box?.value.trim()) runSearch(box.value);
        return;
      }
      searchIdx = (searchIdx + dir + searchHits.length) % searchHits.length;
      const hit = searchHits[searchIdx];
      goToPage(hit.page, true);
      paintAllSearchHits();
      status.textContent = 'Match ' + (searchIdx + 1) + '/' + searchHits.length +
        ' · page ' + hit.page;
      post({ type: 'findResult', count: searchHits.length, index: searchIdx, done: true });
    }

    function computeFitScale() {
      const entry = pageMap.get(pageNum);
      if (!entry) return scale;
      const pad = continuous ? 24 : 12;
      const availW = Math.max(40, viewer.clientWidth - pad);
      const availH = Math.max(40, viewer.clientHeight - pad);
      // Continuous: fit WIDTH only — pages stay centered, stack for multi-page scroll.
      // One-page mode: fit entire page in the viewport (letterbox, no stretch).
      if (continuous) {
        return Math.max(0.25, Math.min(4, availW / entry.widthPt));
      }
      return Math.max(0.25, Math.min(4, Math.min(availW / entry.widthPt, availH / entry.heightPt)));
    }

    async function applyFit(recalcOnly) {
      fitMode = true;
      viewer.classList.add('fit-mode');
      scale = computeFitScale();
      if (!recalcOnly) {
        for (const e of pageMap.values()) e.rendered = false;
        await renderVisiblePages(true);
        layoutAllOverlays();
        layoutAllFillFields();
        layoutAllHighlights();
        paintAllSearchHits();
      }
      scrollToPage(pageNum, false);
      document.getElementById('zoomLabel').textContent = Math.round(scale * 100) + '%';
      status.textContent = continuous
        ? 'Fit width — pages centered · scroll for more'
        : 'Fit — full page · sharp · resizes with window';
      post({ type: 'zoom', scale, fit: true });
    }

    function syncThumbActive() {
      thumbs.querySelectorAll('canvas').forEach(c => {
        const on = Number(c.dataset.page) === pageNum;
        c.classList.toggle('active', on);
        c.closest('.thumb-item')?.classList.toggle('active', on);
      });
    }

    function syncPageFromScroll() {
      if (!pdf || pageMap.size === 0 || !continuous) return;
      const mid = viewer.getBoundingClientRect().top + viewer.clientHeight * 0.35;
      let best = pageNum, bestDist = Infinity;
      for (const [n, entry] of pageMap) {
        const r = entry.wrap.getBoundingClientRect();
        const d = Math.abs(r.top + r.height * 0.2 - mid);
        if (d < bestDist) { bestDist = d; best = n; }
      }
      if (best !== pageNum) {
        pageNum = best;
        pageInput.value = String(pageNum);
        syncThumbActive();
        post({ type: 'page', page: pageNum, pages: pdf.numPages, scale });
      }
    }

    function scrollToPage(n, smooth) {
      const entry = pageMap.get(n);
      if (!entry) return;
      pageNum = n;
      pageInput.value = String(n);
      entry.wrap.scrollIntoView({ behavior: smooth ? 'smooth' : 'auto', block: 'start' });
      renderPageAt(n, false).then(() => layoutOverlaysForPage(n));
      syncThumbActive();
      post({ type: 'page', page: n, pages: pdf.numPages, scale });
    }

    function goToPage(n, smooth) {
      if (!pdf) return;
      n = Math.min(pdf.numPages, Math.max(1, n | 0));
      pageNum = n;
      pageInput.value = String(n);
      for (const [pn, entry] of pageMap) {
        entry.wrap.classList.toggle('active-page', pn === n);
      }
      scrollToPage(n, !!smooth);
      renderVisiblePages(false);
    }

    function pageEntryFromEvent(ev) {
      for (const [n, entry] of pageMap) {
        const r = entry.canvas.getBoundingClientRect();
        if (ev.clientX >= r.left && ev.clientX <= r.right && ev.clientY >= r.top && ev.clientY <= r.bottom)
          return { n, entry, r };
      }
      return null;
    }

    function canvasPoint(ev) {
      const hit = pageEntryFromEvent(ev);
      if (!hit) return { inside: false, page: pageNum, x: 0, y: 0 };
      const { n, entry, r } = hit;
      const x = (ev.clientX - r.left) * (entry.canvas.width / r.width);
      const y = (ev.clientY - r.top) * (entry.canvas.height / r.height);
      return { inside: true, page: n, entry, x, y, r };
    }

    function stampSizePt() {
      const natW = stampImg.naturalWidth || STAMP_MAX_WIDTH_PT;
      const natH = stampImg.naturalHeight || Math.round(STAMP_MAX_WIDTH_PT * 0.3);
      const s = Math.min(1, STAMP_MAX_WIDTH_PT / natW);
      return { w: natW * s, h: natH * s };
    }

    function stampDisplaySize(entry, stampWPt, stampHPt) {
      const { cssW, cssH } = pageCssBox(entry);
      return {
        w: (stampWPt / entry.widthPt) * cssW,
        h: (stampHPt / entry.heightPt) * cssH
      };
    }

    function moveGhost(ev) {
      if (!stampMode || stampPending) return;
      lastPointer = ev;
      const { w: stampWPt, h: stampHPt } = stampSizePt();
      const hit = pageEntryFromEvent(ev);
      const entry = hit?.entry || pageMap.get(pageNum);
      if (!entry) return;
      const { w, h } = stampDisplaySize(entry, stampWPt, stampHPt);
      const vr = viewer.getBoundingClientRect();
      stampGhost.style.display = 'block';
      stampGhost.style.left = (ev.clientX - vr.left - w / 2 + viewer.scrollLeft) + 'px';
      stampGhost.style.top = (ev.clientY - vr.top - h / 2 + viewer.scrollTop) + 'px';
      stampImg.style.maxWidth = w + 'px';
      stampImg.style.maxHeight = h + 'px';
    }

    function snapPlacement(page, xPt, yFromBottom, stampW, stampH, allowSnap) {
      if (!allowSnap) return { xPt, yFromBottom, stampW, stampH, snapped: false };
      const fields = formFields.filter(f => f.page === page && f.w > 8 && f.h > 8);
      let best = null, bestDist = SNAP_RADIUS_PT;
      const cx = xPt + stampW / 2, cy = yFromBottom + stampH / 2;
      for (const f of fields) {
        const dist = Math.hypot(f.x + f.w / 2 - cx, f.y + f.h / 2 - cy);
        if (dist < bestDist) { bestDist = dist; best = f; }
      }
      if (!best) return { xPt, yFromBottom, stampW, stampH, snapped: false };
      const aspect = stampW / stampH;
      let w = stampW, h = stampH;
      const padW = best.w * 0.92, padH = best.h * 0.88;
      if (w > padW) { w = padW; h = w / aspect; }
      if (h > padH) { h = padH; w = h * aspect; }
      return {
        xPt: best.x + (best.w - w) / 2,
        yFromBottom: best.y + (best.h - h) / 2,
        stampW: w, stampH: h, snapped: true, field: best.name || ''
      };
    }

    function createOverlayEl(placement, dataUrl, committed) {
      const el = document.createElement('div');
      el.className = 'stamp-overlay' + (committed ? ' committed' : '') + ' selected';
      el.dataset.id = placement.id;
      const img = document.createElement('img');
      img.src = dataUrl;
      img.alt = 'stamp';
      const handle = document.createElement('div');
      handle.className = 'handle';
      el.appendChild(img);
      el.appendChild(handle);
      el.addEventListener('pointerdown', (ev) => {
        selectOverlay(placement.id);
        const mode = ev.target === handle ? 'resize' : 'move';
        boxDrag = {
          mode, id: placement.id,
          ox: ev.clientX, oy: ev.clientY,
          left: parseFloat(el.style.left) || 0,
          top: parseFloat(el.style.top) || 0,
          w: el.offsetWidth, h: el.offsetHeight
        };
        pendingOverlay = el;
        pendingPlacement = overlays.find(o => o.id === placement.id) || placement;
        stampPending = !committed;
        stampConfirmBtn.style.display = committed ? 'none' : 'inline-block';
        try { el.setPointerCapture(ev.pointerId); } catch (_) {}
        ev.preventDefault();
        ev.stopPropagation();
      });
      return el;
    }

    function layoutOverlay(o) {
      const entry = pageMap.get(o.page);
      if (!entry || !o.el) return;
      const { cssW, cssH, ox, oy } = pageCssBox(entry);
      const drawX = (o.xPt / entry.widthPt) * cssW;
      const drawY = cssH - ((o.yFromBottom + o.stampH) / entry.heightPt) * cssH;
      const imgW = (o.stampW / entry.widthPt) * cssW;
      const imgH = (o.stampH / entry.heightPt) * cssH;
      o.el.style.left = (ox + drawX) + 'px';
      o.el.style.top = (oy + drawY) + 'px';
      o.el.style.width = imgW + 'px';
      o.el.style.height = imgH + 'px';
      if (o.el.parentElement !== entry.wrap)
        entry.wrap.appendChild(o.el);
    }

    function layoutOverlaysForPage(n) {
      for (const o of overlays.filter(x => x.page === n)) layoutOverlay(o);
    }

    function layoutAllOverlays() {
      for (const o of overlays) layoutOverlay(o);
    }

    let selectedOverlayId = null;

    function selectOverlay(id) {
      selectedOverlayId = id;
      for (const o of overlays) o.el?.classList.toggle('selected', o.id === id);
      positionStampFloatBar();
    }

    /** Anchor scrolled out of the viewer → hide its HUD (Acrobat behaviour). */
    function anchorOutOfView(r) {
      const vr = viewer.getBoundingClientRect();
      return r.bottom < vr.top || r.top > vr.bottom || r.right < vr.left || r.left > vr.right;
    }

    function positionStampFloatBar() {
      if (!stampFloatBar) return;
      const o = overlays.find(x => x.id === selectedOverlayId);
      if (!o?.el || !o.el.isConnected) {
        stampFloatBar.style.display = 'none';
        return;
      }
      const r = o.el.getBoundingClientRect();
      if (anchorOutOfView(r)) {
        stampFloatBar.style.display = 'none';
        return;
      }
      stampFloatBar.style.display = 'flex';
      const barW = stampFloatBar.offsetWidth || 96;
      let left = r.left + (r.width - barW) / 2;
      let top = r.top - 34;
      if (top < 8) top = r.bottom + 6;
      left = Math.max(8, Math.min(left, window.innerWidth - barW - 8));
      stampFloatBar.style.left = left + 'px';
      stampFloatBar.style.top = top + 'px';
    }

    function postStampGeometry(o) {
      if (!o) return;
      post({
        type: 'stampMoved',
        id: o.id, page: o.page, xPt: o.xPt, yFromBottom: o.yFromBottom,
        stampW: o.stampW, stampH: o.stampH
      });
    }

    function scaleSelectedStamp(factor) {
      const o = overlays.find(x => x.id === selectedOverlayId);
      if (!o) return;
      const nw = Math.max(24, o.stampW * factor);
      const nh = Math.max(12, o.stampH * factor);
      // Keep visual center stable when resizing via A+/A−
      const cx = o.xPt + o.stampW / 2;
      const cy = o.yFromBottom + o.stampH / 2;
      o.stampW = nw;
      o.stampH = nh;
      o.xPt = Math.max(0, cx - nw / 2);
      o.yFromBottom = Math.max(0, cy - nh / 2);
      layoutOverlay(o);
      positionStampFloatBar();
      if (o.committed) postStampGeometry(o);
      else pendingPlacement = o;
    }

    function deleteSelectedStamp() {
      const o = overlays.find(x => x.id === selectedOverlayId);
      if (!o) return;
      const id = o.id;
      o.el?.remove();
      overlays = overlays.filter(x => x.id !== id);
      if (pendingPlacement?.id === id) pendingPlacement = null;
      if (pendingOverlay?.dataset?.id === id) pendingOverlay = null;
      selectedOverlayId = null;
      stampFloatBar.style.display = 'none';
      post({ type: 'stampDeleted', id });
      status.textContent = 'Signature removed';
    }

    document.getElementById('stampSizeDown')?.addEventListener('click', (e) => {
      e.stopPropagation();
      scaleSelectedStamp(0.88);
    });
    document.getElementById('stampSizeUp')?.addEventListener('click', (e) => {
      e.stopPropagation();
      scaleSelectedStamp(1.14);
    });
    document.getElementById('stampDeleteBtn')?.addEventListener('click', (e) => {
      e.stopPropagation();
      deleteSelectedStamp();
    });
    window.addEventListener('keydown', (ev) => {
      const tag = (ev.target && ev.target.tagName) || '';
      const typing = tag === 'INPUT' || tag === 'TEXTAREA' || ev.target?.isContentEditable;
      if (ev.key === 'Delete' || ev.key === 'Backspace') {
        if (!selectedOverlayId) return;
        if (typing) return;
        deleteSelectedStamp();
        ev.preventDefault();
        return;
      }
      if (!typing && !ev.altKey && !ev.metaKey && (ev.key === 'ArrowLeft' || ev.key === 'ArrowRight')) {
        ev.preventDefault();
        document.getElementById(ev.key === 'ArrowLeft' ? 'prev' : 'next')?.click();
        return;
      }
      if ((ev.ctrlKey || ev.metaKey) && !ev.altKey && (ev.key === 'f' || ev.key === 'F')) {
        ev.preventDefault();
        const panel = document.getElementById('searchPanel');
        if (!panel?.classList.contains('open'))
          document.getElementById('searchToggle')?.click();
        document.getElementById('searchBox')?.focus();
      }
    });

    // ---------- Fill & Sign: click a cell / line, type, A / A / 🗑 ----------

    const fillFloatBar = document.getElementById('fillFloatBar');
    const fillBtn = document.getElementById('fillBtn');

    const MON3 = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
    const MONF = ['January','February','March','April','May','June','July','August','September','October','November','December'];

    function detectDateFormat(s) {
      s = String(s || '').trim();
      if (/^\d{1,2}-[A-Za-z]{3}-\d{4}$/.test(s)) return 'dd-MMM-yyyy';
      if (/^\d{1,2}\/[A-Za-z]{3}\/\d{4}$/.test(s)) return 'dd/MMM/yyyy';
      if (/^\d{1,2}\/\d{1,2}\/\d{4}$/.test(s)) return 'dd/MM/yyyy';
      if (/^\d{4}-\d{2}-\d{2}$/.test(s)) return 'yyyy-MM-dd';
      if (/^[A-Za-z]{3,9}\s+\d{1,2},?\s+\d{4}$/.test(s)) return 'MMMM d, yyyy';
      return '';
    }

    function parseFlexibleDate(s) {
      s = String(s || '').trim();
      if (!s) return null;
      let m = s.match(/^(\d{1,2})[-/]([A-Za-z]{3})[-/](\d{4})$/);
      if (m) {
        const mi = MON3.findIndex(x => x.toLowerCase() === m[2].toLowerCase());
        if (mi >= 0) return new Date(+m[3], mi, +m[1]);
      }
      m = s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);
      if (m) return new Date(+m[3], +m[2] - 1, +m[1]);
      m = s.match(/^(\d{4})-(\d{2})-(\d{2})$/);
      if (m) return new Date(+m[1], +m[2] - 1, +m[3]);
      m = s.match(/^([A-Za-z]+)\s+(\d{1,2}),?\s+(\d{4})$/);
      if (m) {
        const mi = MONF.findIndex(x => x.toLowerCase() === m[1].toLowerCase());
        if (mi >= 0) return new Date(+m[3], mi, +m[2]);
      }
      const d = new Date(s);
      return Number.isNaN(d.getTime()) ? null : d;
    }

    function formatDateValue(d, fmt) {
      const dd = String(d.getDate()).padStart(2, '0');
      const d1 = String(d.getDate());
      const mm = String(d.getMonth() + 1).padStart(2, '0');
      const yyyy = d.getFullYear();
      switch (fmt) {
        case 'dd/MM/yyyy': return dd + '/' + mm + '/' + yyyy;
        case 'yyyy-MM-dd': return yyyy + '-' + mm + '-' + dd;
        case 'dd/MMM/yyyy': return dd + '/' + MON3[d.getMonth()] + '/' + yyyy;
        case 'MMMM d, yyyy': return MONF[d.getMonth()] + ' ' + d1 + ', ' + yyyy;
        default: return dd + '-' + MON3[d.getMonth()] + '-' + yyyy;
      }
    }

    function sniffDateFormat(profile) {
      const pref = String(profile?.dateFormat || '').trim();
      if (pref) return pref;
      for (const input of document.querySelectorAll('.annotationLayer input')) {
        const f = detectDateFormat(input.value);
        if (f) return f;
      }
      return detectDateFormat(profile?.dob) || 'dd-MMM-yyyy';
    }

    function isEmailLabel(n) { return /e-?mail/.test(n) || (n.includes('mail') && !n.includes('male')); }
    function isPhoneLabel(n) { return /phone|tel\b|mobile|\bhp\b|contact no/.test(n); }
    function isAddressLabel(n) { return /address|street|jalan|residential/.test(n) && !/email/.test(n); }
    function isNationalityLabel(n) { return /nationalit|citizenship|citizen/.test(n); }
    function isBirthLabel(n) { return /date of birth|\bdob\b|birth date|birthdate|tarikh lahir/.test(n); }
    function isNameLabel(n) {
      if (!n) return false;
      if (/company|institution|employer|father|mother|spouse|school|university|agency|vessel/.test(n)) return false;
      return /full name|applicant.?name|given name|name as in|principal name|^name$/.test(n);
    }
    function isNumericLike(input) {
      if (!input) return false;
      const t = (input.type || '').toLowerCase();
      if (t === 'number' || t === 'tel') return true;
      const mode = (input.inputMode || '').toLowerCase();
      return mode === 'numeric' || mode === 'decimal' || mode === 'tel';
    }

    function formatDobFor(profile, sample) {
      const raw = profile.dob || '';
      const d = parseFlexibleDate(raw);
      if (!d) return raw;
      const fmt = detectDateFormat(sample) || sniffDateFormat(profile);
      return formatDateValue(d, fmt);
    }

    function profileValueFor(label, profile, sample, input) {
      const n = String(label || '').toLowerCase();
      if (!n) return '';
      if (isEmailLabel(n)) return profile.email || '';
      if (isPhoneLabel(n)) {
        const v = profile.phone || '';
        if (isNumericLike(input)) return String(v).replace(/[^\d+]/g, '') || v;
        return v;
      }
      if (isAddressLabel(n)) return profile.address || '';
      if (isNationalityLabel(n)) return profile.nationality || '';
      if (isBirthLabel(n)) return formatDobFor(profile, sample);
      if (isNameLabel(n)) return profile.name || '';
      return '';
    }

    function setWidgetValue(input, v) {
      if (input.tagName === 'SELECT') {
        const want = String(v).trim().toLowerCase();
        let hit = null;
        for (const opt of input.options) {
          const t = String(opt.text || opt.value || '').trim().toLowerCase();
          if (!t) continue;
          if (t === want || t.startsWith(want) || want.startsWith(t) || t.includes(want)) {
            hit = opt.value;
            break;
          }
        }
        if (hit == null) return false;
        input.value = hit;
      } else {
        const max = Number(input.maxLength);
        if (max > 0 && max < 500 && v.length > max) return false;
        input.value = v;
      }
      input.dispatchEvent(new Event('input', { bubbles: true }));
      input.dispatchEvent(new Event('change', { bubbles: true }));
      return true;
    }

    function widgetLabel(input) {
      return (input.getAttribute('aria-label') || input.name || input.title || '').toString();
    }

    function collectBoundedProfile() {
      const out = { name: '', email: '', phone: '', address: '', dob: '', nationality: '', dateFormat: '' };
      const consider = (label, value) => {
        const n = String(label || '').toLowerCase();
        const v = String(value || '').trim();
        if (!n || !v) return;
        const fmt = detectDateFormat(v);
        if (fmt) out.dateFormat = out.dateFormat || fmt;
        if (isEmailLabel(n)) out.email = v;
        else if (isPhoneLabel(n)) out.phone = v;
        else if (isNationalityLabel(n)) out.nationality = v;
        else if (isBirthLabel(n)) out.dob = v;
        else if (isAddressLabel(n)) out.address = v;
        else if (isNameLabel(n)) out.name = v;
      };
      for (const input of document.querySelectorAll('.annotationLayer input, .annotationLayer textarea, .annotationLayer select')) {
        if (input.type === 'radio' || input.type === 'checkbox') continue;
        consider(widgetLabel(input), input.value);
      }
      for (const f of fillFields) {
        if (f.snapped === 'acroform') consider(f.fieldName || '', f.text || '');
      }
      return out;
    }

    function applyAutofillProfile(profile) {
      enterFillMode();
      let filled = 0;
      for (const input of document.querySelectorAll('.annotationLayer input, .annotationLayer textarea, .annotationLayer select')) {
        if (input.disabled || input.type === 'radio' || input.type === 'checkbox') continue;
        if ((input.value || '').trim()) continue;
        const label = widgetLabel(input);
        const v = profileValueFor(label, profile, input.value, input);
        if (!v) continue;
        if (setWidgetValue(input, v)) filled++;
      }
      for (const f of fillFields) {
        if ((f.text || '').trim()) continue;
        const label = f.snapped === 'acroform' ? (f.fieldName || '') : '';
        const v = profileValueFor(label, profile, f.text || '', null);
        if (!v) continue;
        f.text = v;
        if (f.el) f.el.textContent = v;
        filled++;
      }
      for (const field of formFields) {
        const already = fillFields.some(x =>
          x.page === field.page &&
          Math.abs(x.xPt - field.x) < 2 &&
          Math.abs(x.yFromBottom - field.y) < 2);
        if (already) continue;
        const v = profileValueFor(field.name, profile, '', null);
        if (!v) continue;
        addFillField({
          page: field.page,
          xPt: field.x + 1,
          yFromBottom: field.y + 1,
          wPt: Math.max(8, field.w - 2),
          hPt: Math.max(8, field.h - 2),
          fontPt: Math.min(28, Math.max(7, (field.h - 2) * 0.58)),
          text: v,
          snapped: 'acroform',
          cover: false,
          focus: false
        });
        filled++;
      }
      postFillTexts();
      status.textContent = filled ? ('Autofill · ' + filled + ' typed box(es) from local details')
        : 'No matching empty boxes — open My details, or type the field then Save';
    }

    function enterFillMode() {
      if (stampMode || stampPending) exitStampMode();
      highlightMode = false;
      document.getElementById('hlBtn')?.classList.remove('on');
      document.getElementById('markBtn')?.classList.remove('on');
      fillMode = true;
      fillBtn.classList.add('on');
      viewer.classList.add('fill-mode');
      banner.style.display = 'block';
      banner.textContent = 'Click a field, or drag to draw a fill box · A / A / 🗑 · Save writes into this PDF';
      status.textContent = 'Fill mode — type, or drag a box to add';
    }

    function exitFillMode() {
      if (!fillMode && !fillDraw && !fillResize) {
        hideFillDrawGhost();
        return;
      }
      fillMode = false;
      fillDraw = null;
      fillResize = null;
      fillDrawSuppressClick = false;
      hideFillDrawGhost();
      fillBtn.classList.remove('on');
      viewer.classList.remove('fill-mode');
      commitActiveFill();
      banner.style.display = 'none';
    }

    /** AcroForm rect under a bottom-origin point, if the host pushed any. */
    function fillFieldRectAt(page, xPt, yBotPt) {
      for (const f of formFields) {
        if (f.page !== page || f.w <= 6 || f.h <= 6) continue;
        if (xPt >= f.x && xPt <= f.x + f.w && yBotPt >= f.y && yBotPt <= f.y + f.h)
          return { xPt: f.x + 1, yFromBottom: f.y + 1, wPt: f.w - 2, hPt: f.h - 2 };
      }
      return null;
    }

    /**
     * Acrobat-style table cell detection: scan the rendered canvas around the
     * click for ruling lines (long continuous dark runs). Works for vector and
     * scanned tables alike. Returns canvas-pixel rect of the cell interior.
     */
    function detectCellAt(entry, px, py) {
      const cv = entry.canvas;
      if (!cv.width || !cv.height) return null;
      const pxPerPt = cv.width / entry.widthPt;
      // 320pt was ~1600px²/click on a fit-scaled page (~11 MB getImageData, synchronous in the
      // click handler). 170pt covers any real table cell / form line and cuts the read to ~1/3.
      const win = Math.round(170 * pxPerPt);            // search radius ≈ 170 pt
      const x0 = Math.max(0, Math.round(px - win)), x1 = Math.min(cv.width - 1, Math.round(px + win));
      const y0 = Math.max(0, Math.round(py - win)), y1 = Math.min(cv.height - 1, Math.round(py + win));
      const w = x1 - x0 + 1, h = y1 - y0 + 1;
      if (w < 8 || h < 8) return null;
      let data;
      try { data = cv.getContext('2d', { willReadFrequently: true }).getImageData(x0, y0, w, h).data; }
      catch (_) { return null; }
      const darkAt = (x, y) => {
        if (x < x0 || x > x1 || y < y0 || y > y1) return false;
        const i = ((y - y0) * w + (x - x0)) * 4;
        return data[i] * 0.3 + data[i + 1] * 0.59 + data[i + 2] * 0.11 < 130;
      };
      const spanPx = Math.max(6, Math.round(11 * pxPerPt)); // ruling must run ≥ ~11pt past the click
      const cx = Math.round(px), cy = Math.round(py);
      // A vertical ruling at column x: ≥88% dark across the local span (±1px slack for AA)
      const vLine = (x) => {
        const a = Math.max(y0, cy - spanPx), b = Math.min(y1, cy + spanPx);
        if (b - a < spanPx) return false;
        let hit = 0, total = 0;
        for (let y = a; y <= b; y++) { total++; if (darkAt(x, y) || darkAt(x + 1, y) || darkAt(x - 1, y)) hit++; }
        return hit / total > 0.88;
      };
      const hLine = (y) => {
        const a = Math.max(x0, cx - spanPx), b = Math.min(x1, cx + spanPx);
        if (b - a < spanPx) return false;
        let hit = 0, total = 0;
        for (let x = a; x <= b; x++) { total++; if (darkAt(x, y) || darkAt(x, y + 1) || darkAt(x, y - 1)) hit++; }
        return hit / total > 0.88;
      };
      let left = -1, right = -1, top = -1, bottom = -1;
