      for (let x = cx - 2; x >= x0; x--) if (vLine(x)) { left = x; break; }
      for (let x = cx + 2; x <= x1; x++) if (vLine(x)) { right = x; break; }
      for (let y = cy - 2; y >= y0; y--) if (hLine(y)) { top = y; break; }
      for (let y = cy + 2; y <= y1; y++) if (hLine(y)) { bottom = y; break; }
      // Underline-only fields: bottom rule found, no side rules → box sits on the line
      if (bottom >= 0 && (left < 0 || right < 0)) {
        const hPx = Math.round(20 * pxPerPt);
        if (top < 0 || bottom - top > hPx * 2.2)
          return { x: Math.max(x0, cx - Math.round(70 * pxPerPt)), y: bottom - hPx - 2, w: Math.round(150 * pxPerPt), h: hPx, kind: 'line' };
      }
      if (left < 0 || right < 0 || top < 0 || bottom < 0) return null;
      if (right - left < 8 || bottom - top < 6) return null;
      return { x: left + 2, y: top + 2, w: right - left - 3, h: bottom - top - 3, kind: 'cell' };
    }

    function flashCell(entry, cellPx) {
      const { cssW, cssH, ox, oy } = pageCssBox(entry);
      const sx = cssW / (entry.canvas.width || 1), sy = cssH / (entry.canvas.height || 1);
      const el = document.createElement('div');
      el.className = 'fill-cell-flash';
      el.style.left = (ox + cellPx.x * sx) + 'px';
      el.style.top = (oy + cellPx.y * sy) + 'px';
      el.style.width = (cellPx.w * sx) + 'px';
      el.style.height = (cellPx.h * sy) + 'px';
      entry.wrap.appendChild(el);
      setTimeout(() => { el.style.opacity = '0'; }, 350);
      setTimeout(() => el.remove(), 900);
    }

    function createFillEl(f) {
      const el = document.createElement('div');
      el.className = 'fill-text';
      el.dataset.id = f.id;
      const inner = document.createElement('div');
      inner.className = 'fill-inner';
      inner.contentEditable = 'true';
      inner.spellcheck = false;
      inner.textContent = f.text || '';
      const handle = document.createElement('div');
      handle.className = 'handle';
      handle.title = 'Drag to resize box';
      el.appendChild(inner);
      el.appendChild(handle);
      handle.addEventListener('mousedown', (ev) => {
        ev.preventDefault();
        ev.stopPropagation();
        fillResize = {
          id: f.id,
          ox: ev.clientX,
          oy: ev.clientY,
          wPt: f.wPt,
          hPt: f.hPt,
          xPt: f.xPt,
          yFromBottom: f.yFromBottom
        };
        activeFillId = f.id;
        el.classList.add('active');
        positionFillFloatBar();
      });
      inner.addEventListener('input', () => {
        f.text = inner.textContent || '';
        scheduleFillPost();
      });
      inner.addEventListener('focus', () => {
        activeFillId = f.id;
        el.classList.add('active');
        post({ type: 'netieTyping', typing: true });
        positionFillFloatBar();
      });
      inner.addEventListener('blur', () => {
        el.classList.remove('active');
        post({ type: 'netieTyping', typing: false });
        f.text = inner.textContent || '';
        postFillTexts();
        setTimeout(() => {
          const still = fillFields.find(x => x.id === f.id);
          if (!still) return;
          const focusInBar = document.activeElement?.closest?.('#fillFloatBar');
          if (document.activeElement !== inner && !focusInBar) {
            if (!(f.text || '').trim()) removeFillField(f.id);
            else if (activeFillId === f.id) { activeFillId = null; positionFillFloatBar(); }
          }
        }, 120);
      });
      inner.addEventListener('keydown', (ev) => {
        ev.stopPropagation();
        if (ev.key === 'Enter') { ev.preventDefault(); inner.blur(); }
        else if (ev.key === 'Escape') { ev.preventDefault(); inner.blur(); }
      });
      el.addEventListener('mousedown', (ev) => {
        if (ev.target === handle) return;
        ev.stopPropagation();
      });
      return el;
    }

    function fillInner(el) {
      return el?.querySelector?.('.fill-inner') || null;
    }

    function layoutFillField(f) {
      const entry = pageMap.get(f.page);
      if (!entry || !f.el) return;
      const { cssW, cssH, ox, oy } = pageCssBox(entry);
      const kx = cssW / entry.widthPt;
      const ky = cssH / entry.heightPt;
      f.el.style.left = (ox + f.xPt * kx) + 'px';
      f.el.style.top = (oy + (entry.heightPt - f.yFromBottom - f.hPt) * ky) + 'px';
      f.el.style.width = Math.max(10, f.wPt * kx) + 'px';
      f.el.style.height = Math.max(8, f.hPt * ky) + 'px';
      const inner = fillInner(f.el);
      if (inner) {
        inner.style.fontSize = Math.max(6, f.fontPt * ky) + 'px';
        inner.style.lineHeight = Math.max(8, f.hPt * ky) + 'px';
        if (inner.textContent !== (f.text || '')) inner.textContent = f.text || '';
      }
      if (f.el.parentElement !== entry.wrap) entry.wrap.appendChild(f.el);
    }

    function layoutFillFieldsForPage(n) {
      for (const f of fillFields.filter(x => x.page === n)) layoutFillField(f);
    }

    function layoutAllFillFields() {
      for (const f of fillFields) layoutFillField(f);
    }

    function positionFillFloatBar() {
      if (!fillFloatBar) return;
      const f = fillFields.find(x => x.id === activeFillId);
      if (!f?.el || !f.el.isConnected) { fillFloatBar.style.display = 'none'; return; }
      const r = f.el.getBoundingClientRect();
      if (anchorOutOfView(r)) { fillFloatBar.style.display = 'none'; return; }
      fillFloatBar.style.display = 'flex';
      const barW = fillFloatBar.offsetWidth || 96;
      let left = r.left + (r.width - barW) / 2;
      let top = r.top - 34;
      if (top < 8) top = r.bottom + 6;
      left = Math.max(8, Math.min(left, window.innerWidth - barW - 8));
      fillFloatBar.style.left = left + 'px';
      fillFloatBar.style.top = top + 'px';
    }

    function scaleActiveFill(k) {
      const f = fillFields.find(x => x.id === activeFillId);
      if (!f) return;
      f.fontPt = Math.min(48, Math.max(6, f.fontPt * k));
      if (f.snapped !== 'cell' && f.snapped !== 'acroform')
        f.hPt = Math.max(f.hPt, f.fontPt * 1.4);   // free boxes grow with the text
      layoutFillField(f);
      positionFillFloatBar();
      scheduleFillPost();
    }

    function removeFillField(id) {
      const f = fillFields.find(x => x.id === id);
      if (!f) return;
      f.el?.remove();
      fillFields = fillFields.filter(x => x.id !== id);
      if (activeFillId === id) activeFillId = null;
      positionFillFloatBar();
      scheduleFillPost();
      status.textContent = 'Text box removed';
    }

    function commitActiveFill() {
      const f = fillFields.find(x => x.id === activeFillId);
      const inner = fillInner(f?.el);
      if (inner && document.activeElement === inner) inner.blur();
    }

    function placeFillAtClick(p) {
      const xPt = (p.x / p.entry.canvas.width) * p.entry.widthPt;
      const yBotPt = p.entry.heightPt - (p.y / p.entry.canvas.height) * p.entry.heightPt;
      let rect = fillFieldRectAt(p.page, xPt, yBotPt);
      let snapped = rect ? 'acroform' : '';
      if (!rect) {
        const cell = detectCellAt(p.entry, p.x, p.y);
        if (cell) {
          rect = {
            xPt: (cell.x / p.entry.canvas.width) * p.entry.widthPt,
            yFromBottom: p.entry.heightPt - ((cell.y + cell.h) / p.entry.canvas.height) * p.entry.heightPt,
            wPt: (cell.w / p.entry.canvas.width) * p.entry.widthPt,
            hPt: (cell.h / p.entry.canvas.height) * p.entry.heightPt
          };
          snapped = cell.kind;
          flashCell(p.entry, cell);
        }
      }
      if (!rect) {
        const wPt = 150, hPt = 20;
        rect = { xPt: Math.max(0, Math.min(xPt - 4, p.entry.widthPt - wPt)), yFromBottom: Math.max(0, yBotPt - hPt / 2), wPt, hPt };
      }
      addFillField({
        page: p.page,
        xPt: rect.xPt, yFromBottom: rect.yFromBottom, wPt: rect.wPt, hPt: rect.hPt,
        fontPt: Math.min(28, Math.max(7, rect.hPt * 0.58)),
        text: '', snapped, cover: false, focus: true
      });
      status.textContent = snapped === 'cell' ? 'Snapped to table cell — type'
        : snapped === 'acroform' ? 'Snapped to form field — type'
        : snapped === 'line' ? 'On the line — type'
        : 'Type here · drag corner to resize · A / A / 🗑 above';
    }

    function placeFillFromDrag(d) {
      const entry = d.entry;
      const x0 = Math.min(d.x0, d.x1), y0 = Math.min(d.y0, d.y1);
      const x1 = Math.max(d.x0, d.x1), y1 = Math.max(d.y0, d.y1);
      const wPx = Math.max(12, x1 - x0), hPx = Math.max(10, y1 - y0);
      const xPt = (x0 / entry.canvas.width) * entry.widthPt;
      const hPt = (hPx / entry.canvas.height) * entry.heightPt;
      const wPt = (wPx / entry.canvas.width) * entry.widthPt;
      const yFromBottom = entry.heightPt - ((y1) / entry.canvas.height) * entry.heightPt;
      addFillField({
        page: d.page,
        xPt, yFromBottom, wPt, hPt,
        fontPt: Math.min(28, Math.max(7, hPt * 0.58)),
        text: '', snapped: 'drawn', cover: false, focus: true
      });
      status.textContent = 'Drawn fill box — type · drag corner to resize';
    }

    function syncFillDrawGhost(d) {
      const ghost = document.getElementById('fillDrawGhost');
      if (!ghost || !d?.entry) return;
      const wrap = d.entry.wrap;
      if (ghost.parentElement !== wrap) wrap.appendChild(ghost);
      const { cssW, cssH, ox, oy } = pageCssBox(d.entry);
      // fillDraw coords are canvas bitmap pixels
      const sx = cssW / (d.entry.canvas.width || 1);
      const sy = cssH / (d.entry.canvas.height || 1);
      const x0 = Math.min(d.x0, d.x1), y0 = Math.min(d.y0, d.y1);
      const x1 = Math.max(d.x0, d.x1), y1 = Math.max(d.y0, d.y1);
      ghost.style.display = 'block';
      ghost.style.left = (ox + x0 * sx) + 'px';
      ghost.style.top = (oy + y0 * sy) + 'px';
      ghost.style.width = Math.max(2, (x1 - x0) * sx) + 'px';
      ghost.style.height = Math.max(2, (y1 - y0) * sy) + 'px';
    }

    function hideFillDrawGhost() {
      const ghost = document.getElementById('fillDrawGhost');
      if (ghost) ghost.style.display = 'none';
    }

    pagesEl.addEventListener('mousedown', (ev) => {
      if (!fillMode || stampMode || stampPending || highlightMode || regionMode) return;
      if (ev.target.closest?.('.stamp-overlay') || ev.target.closest?.('.fill-text')) return;
      if (ev.target.closest?.('.annotationLayer section, .annotationLayer :is(input, textarea, select)')) return;
      if (ev.button !== 0) return;
      commitActiveFill();
      const p = canvasPoint(ev);
      if (!p.inside || !p.entry) return;
      fillDraw = { page: p.page, entry: p.entry, x0: p.x, y0: p.y, x1: p.x, y1: p.y };
      syncFillDrawGhost(fillDraw);
      ev.preventDefault();
    });

    pagesEl.addEventListener('click', (ev) => {
      if (!fillMode || stampMode || stampPending || boxDrag || fillResize) return;
      if (fillDrawSuppressClick) {
        fillDrawSuppressClick = false;
        return;
      }
      if (ev.target.closest?.('.stamp-overlay') || ev.target.closest?.('.fill-text')) return;
      if (ev.target.closest?.('.annotationLayer section, .annotationLayer :is(input, textarea, select)')) return;
      // Click path only when no drag draw (drag finishes on mouseup)
      if (fillDraw) return;
      commitActiveFill();
      const p = canvasPoint(ev);
      if (!p.inside || !p.entry) return;
      placeFillAtClick(p);
    });

    function scheduleFillPost() {
      clearTimeout(fillPostTimer);
      fillPostTimer = setTimeout(postFillTexts, 120);
    }

    function postFillTexts() {
      clearTimeout(fillPostTimer);
      fillPostTimer = null;
      post({
        type: 'fillTexts',
        texts: fillFields.filter(f => (f.text || '').trim()).map(f => ({
          id: f.id, page: f.page, xPt: f.xPt, yFromBottom: f.yFromBottom,
          wPt: f.wPt, hPt: f.hPt, fontPt: f.fontPt, text: f.text,
          cover: !!f.cover
        }))
      });
    }

    async function flushAllToHost() {
      commitActiveFill();
      clearTimeout(fillPostTimer);
      fillPostTimer = null;
      for (const o of overlays.filter(x => x.committed && x.el)) {
        placementFromOverlayCss(o);
        postStampGeometry(o);
      }
      postFillTexts();
      postHighlights();
      let acroFormPdf = '';
      if (pdf?.annotationStorage && pdf.annotationStorage.size > 0) {
        try {
          const data = await pdf.saveDocument();
          acroFormPdf = u8ToB64(data);
        } catch (e) {
          post({ type: 'acroFormSaveFailed', message: String(e && e.message || e) });
        }
      }
      post({
        type: 'flushReady',
        stamps: overlays.filter(x => x.committed).length,
        fills: fillFields.filter(f => (f.text || '').trim()).length,
        highlights: highlights.length,
        acroFormPdf,
        profileHarvest: collectBoundedProfile()
      });
    }

    function addFillField(t) {
      const f = {
        id: t.id || uid(),
        page: t.page | 0,
        xPt: Number(t.xPt) || 0,
        yFromBottom: Number(t.yFromBottom) || 0,
        wPt: Math.max(8, Number(t.wPt) || 120),
        hPt: Math.max(8, Number(t.hPt) || 16),
        fontPt: Math.min(48, Math.max(6, Number(t.fontPt) || 11)),
        text: t.text || '',
        snapped: t.snapped || '',
        cover: !!t.cover,
        el: null
      };
      f.el = createFillEl(f);
      fillFields.push(f);
      layoutFillField(f);
      if (t.focus) {
        const inner = fillInner(f.el);
        (inner || f.el).focus();
        activeFillId = f.id;
        positionFillFloatBar();
      }
      return f;
    }

    function seedFillTexts(texts, opts) {
      const replace = !!(opts && opts.replace);
      if (replace) {
        for (const f of fillFields) f.el?.remove();
        fillFields = [];
        activeFillId = null;
      }
      if (!Array.isArray(texts) || !texts.length) {
        positionFillFloatBar();
        postFillTexts();
        return;
      }
      enterFillMode();
      for (const t of texts)
        addFillField(t);
      layoutAllFillFields();
      postFillTexts();
      status.textContent = `${texts.length} text box(es) — edit then Save`;
    }

    async function exportPagePng(n) {
      const page = (n | 0) || pageNum;
      if (pdf && page !== pageNum) await goToPage(page, true);
      await renderVisiblePages(true);
      const entry = pageMap.get(page);
      if (!entry?.canvas) {
        post({ type: 'pagePng', page, error: 'page not rendered' });
        return;
      }
      let dataUrl = '';
      try { dataUrl = entry.canvas.toDataURL('image/png'); }
      catch (err) {
        post({ type: 'pagePng', page, error: err.message || 'export failed' });
        return;
      }
      post({
        type: 'pagePng', page, dataUrl,
        widthPt: entry.widthPt, heightPt: entry.heightPt,
        widthPx: entry.canvas.width, heightPx: entry.canvas.height
      });
    }

    // Keep focus in the text box while clicking A+/A− (Acrobat behaviour)
    fillFloatBar.addEventListener('mousedown', (ev) => {
      if (ev.target?.id !== 'fillDeleteBtn') ev.preventDefault();
    });
    document.getElementById('fillSizeDown')?.addEventListener('click', (e) => {
      e.stopPropagation();
      scaleActiveFill(0.87);
    });
    document.getElementById('fillSizeUp')?.addEventListener('click', (e) => {
      e.stopPropagation();
      scaleActiveFill(1.15);
    });
    document.getElementById('fillDeleteBtn')?.addEventListener('click', (e) => {
      e.stopPropagation();
      if (activeFillId) removeFillField(activeFillId);
    });
    fillBtn.onclick = () => { fillMode ? exitFillMode() : enterFillMode(); };

    function placementFromOverlayCss(o) {
      const entry = pageMap.get(o.page);
      if (!entry || !o.el) return o;
      const { cssW, cssH, ox, oy } = pageCssBox(entry);
      const leftCss = parseFloat(o.el.style.left) || 0;
      const topCss = parseFloat(o.el.style.top) || 0;
      const wCss = parseFloat(o.el.style.width) || 1;
      const hCss = parseFloat(o.el.style.height) || 1;
      const drawX = leftCss - ox;
      const drawY = topCss - oy;
      o.stampW = (wCss / cssW) * entry.widthPt;
      o.stampH = (hCss / cssH) * entry.heightPt;
      o.xPt = Math.max(0, (drawX / cssW) * entry.widthPt);
      o.yFromBottom = Math.max(0, entry.heightPt - ((drawY + hCss) / cssH) * entry.heightPt);
      return o;
    }

    function placeStamp(ev) {
      const p = canvasPoint(ev);
      if (!p.inside || !p.entry) {
        status.textContent = 'Drop on the white page area';
        return;
      }
      let { w: stampWPt, h: stampHPt } = stampSizePt();
      const centerX = (p.x / p.entry.canvas.width) * p.entry.widthPt;
      const centerY = (p.y / p.entry.canvas.height) * p.entry.heightPt;
      let xPt = Math.max(0, centerX - stampWPt / 2);
      let yFromBottom = Math.max(0, p.entry.heightPt - centerY - stampHPt / 2);
      const snapped = snapPlacement(p.page, xPt, yFromBottom, stampWPt, stampHPt, !!ev.shiftKey);
      xPt = snapped.xPt; yFromBottom = snapped.yFromBottom;
      stampWPt = snapped.stampW; stampHPt = snapped.stampH;

      const id = uid();
      const placement = {
        id, page: p.page, xPt, yFromBottom,
        pageWidthPt: p.entry.widthPt, pageHeightPt: p.entry.heightPt,
        stampW: stampWPt, stampH: stampHPt,
        snapped: snapped.snapped, fieldName: snapped.field || '',
        dataUrl: stampDataUrl, committed: false, el: null
      };
      const el = createOverlayEl(placement, stampDataUrl, false);
      placement.el = el;
      for (const o of [...overlays]) {
        if (!o.committed) { o.el?.remove(); }
      }
      overlays = overlays.filter(o => o.committed);
      overlays.push(placement);
      pendingPlacement = placement;
      pendingOverlay = el;
      stampPending = true;
      stampMode = false;
      dragging = false;
      stampGhost.style.display = 'none';
      viewer.classList.remove('stamp-mode');
      layoutOverlay(placement);
      // Auto-keep: register with host immediately — Keep button is no longer required
      keepPendingStamp();
      banner.style.display = 'block';
      banner.textContent = 'Drag the signature box anytime · autosaves into this PDF';
      status.textContent = snapped.snapped
        ? 'Snapped · drag to adjust · autosaving'
        : 'Placed · drag to adjust · autosaving';
    }

    function keepPendingStamp() {
      if (!pendingPlacement) return;
      const o = placementFromOverlayCss(pendingPlacement);
      o.committed = true;
      o.el?.classList.add('committed');
      o.el?.classList.add('selected');
      post({
        type: 'stampPending',
        id: o.id,
        page: o.page,
        xPt: o.xPt,
        yFromBottom: o.yFromBottom,
        stampW: o.stampW,
        stampH: o.stampH,
        pageWidthPt: o.pageWidthPt,
        pageHeightPt: o.pageHeightPt,
        snapped: !!o.snapped,
        fieldName: o.fieldName || '',
        dataUrl: o.dataUrl || stampDataUrl || ''
      });
      stampPending = false;
      pendingPlacement = null;
      pendingOverlay = null;
      stampConfirmBtn.style.display = 'none';
      stampBtn.classList.remove('active', 'hot');
      banner.style.display = 'block';
      banner.textContent = 'Drag signature boxes · Save is optional (autosave on)';
      status.textContent = 'Signature ready — drag anytime · writing into this file';
    }

    function enterStampMode(dataUrl) {
      // Sign must win over Fill draw handlers — otherwise click/drag never places a stamp.
      exitFillMode();
      clearUncommitted();
      fillDraw = null;
      fillResize = null;
      fillDrawSuppressClick = false;
      hideFillDrawGhost();
      if (dataUrl) {
        stampDataUrl = dataUrl;
        stampImg.src = dataUrl;
      }
      stampMode = true;
      stampPending = false;
      highlightMode = false;
      // Do NOT arm dragging here — a leftover mouseup from the dialog/toolbar
      // would place off-page and leave the user thinking Sign is broken.
      dragging = false;
      viewer.classList.add('stamp-mode');
      banner.style.display = 'block';
      banner.textContent = 'Click the page to place — then drag the box anytime';
      stampBtn.classList.add('active', 'hot');
      stampBtn.textContent = 'Cancel placement';
      stampConfirmBtn.style.display = 'none';
      status.textContent = 'Move over the page · click to place (Shift = snap to field)';
    }

    function clearUncommitted() {
      for (const o of overlays.filter(x => !x.committed)) o.el?.remove();
      overlays = overlays.filter(x => x.committed);
      stampPending = false;
      pendingPlacement = null;
      pendingOverlay = null;
      stampConfirmBtn.style.display = 'none';
      boxDrag = null;
    }

    function exitStampMode() {
      stampMode = false;
      dragging = false;
      clearUncommitted();
      viewer.classList.remove('stamp-mode');
      banner.style.display = 'none';
      stampGhost.style.display = 'none';
      stampBtn.classList.remove('active', 'hot');
      stampBtn.textContent = 'Cancel placement';
    }

    function clearAllOverlays() {
      for (const o of overlays) o.el?.remove();
      overlays = [];
      selectedOverlayId = null;
      if (stampFloatBar) stampFloatBar.style.display = 'none';
      clearUncommitted();
    }

    viewer.addEventListener('mousemove', (ev) => {
      if (stampMode && !stampPending) moveGhost(ev);
      if (fillDraw) {
        const p = canvasPoint(ev);
        if (p.inside && p.entry && p.page === fillDraw.page) {
          fillDraw.x1 = p.x;
          fillDraw.y1 = p.y;
        } else {
          // clamp in canvas bitmap pixels (same space as canvasPoint)
          const cr = fillDraw.entry.canvas.getBoundingClientRect();
          const sx = fillDraw.entry.canvas.width / (cr.width || 1);
          const sy = fillDraw.entry.canvas.height / (cr.height || 1);
          fillDraw.x1 = Math.max(0, Math.min(fillDraw.entry.canvas.width, (ev.clientX - cr.left) * sx));
          fillDraw.y1 = Math.max(0, Math.min(fillDraw.entry.canvas.height, (ev.clientY - cr.top) * sy));
        }
        syncFillDrawGhost(fillDraw);
      }
      if (fillResize) {
        const f = fillFields.find(x => x.id === fillResize.id);
        const entry = f ? pageMap.get(f.page) : null;
        if (f && entry) {
          const { cssW, cssH } = pageCssBox(entry);
          const dxPt = ((ev.clientX - fillResize.ox) / cssW) * entry.widthPt;
          const dyPt = ((ev.clientY - fillResize.oy) / cssH) * entry.heightPt;
          f.wPt = Math.max(12, fillResize.wPt + dxPt);
          f.hPt = Math.max(10, fillResize.hPt + dyPt);
          f.yFromBottom = Math.max(0, fillResize.yFromBottom - dyPt);
          layoutFillField(f);
          positionFillFloatBar();
        }
      }
      if (boxDrag && pendingOverlay) {
        const dx = ev.clientX - boxDrag.ox;
        const dy = ev.clientY - boxDrag.oy;
        if (boxDrag.mode === 'move') {
          pendingOverlay.style.left = (boxDrag.left + dx) + 'px';
          pendingOverlay.style.top = (boxDrag.top + dy) + 'px';
        } else {
          pendingOverlay.style.width = Math.max(24, boxDrag.w + dx) + 'px';
          pendingOverlay.style.height = Math.max(16, boxDrag.h + dy) + 'px';
        }
      }
    });

    // Scroll: overlays are absolute inside page-wrap — they move with the page.
    // Do NOT re-layout fills/stamps/highlights here (was a source of flying boxes + lag).
    let scrollRafPending = false;
    viewer.addEventListener('scroll', () => {
      banner.style.top = (viewer.scrollTop + 12) + 'px';
      if (scrollRafPending) return;
      scrollRafPending = true;
      requestAnimationFrame(() => {
        scrollRafPending = false;
        if (stampMode && !stampPending && lastPointer) moveGhost(lastPointer);
        positionStampFloatBar();
        positionFillFloatBar();
        syncPageFromScroll();
      });
      clearTimeout(viewer._scrollTimer);
      viewer._scrollTimer = setTimeout(() => renderVisiblePages(false), 40);
    }, { passive: true });

    viewer.addEventListener('mousedown', (ev) => {
      if (!stampMode || stampPending) return;
      if (ev.target.closest?.('.stamp-overlay') || ev.target.closest?.('#stampFloatBar')) return;
      dragging = true;
      moveGhost(ev);
      ev.preventDefault();
    });

    // Click-to-place (Acrobat-style) — also handles mouseup after mousedown on page
    viewer.addEventListener('click', (ev) => {
      if (!stampMode || stampPending || !stampDataUrl) return;
      if (ev.target.closest?.('.stamp-overlay') || ev.target.closest?.('#stampFloatBar')) return;
      if (ev.target.closest?.('#banner')) return;
      placeStamp(ev);
      dragging = false;
      ev.preventDefault();
    });

    window.addEventListener('mouseup', (ev) => {
      if (fillResize) {
        const f = fillFields.find(x => x.id === fillResize.id);
        if (f) {
          scheduleFillPost();
          positionFillFloatBar();
        }
        fillResize = null;
        fillDrawSuppressClick = true;
        ev.preventDefault();
        return;
      }
      if (fillDraw) {
        const d = fillDraw;
        fillDraw = null;
        hideFillDrawGhost();
        const dx = Math.abs(d.x1 - d.x0), dy = Math.abs(d.y1 - d.y0);
        if (dx >= 10 || dy >= 10) {
          placeFillFromDrag(d);
          fillDrawSuppressClick = true;
        } else {
          // Tiny drag = click-to-snap / free box
          placeFillAtClick({ page: d.page, entry: d.entry, x: d.x0, y: d.y0, inside: true });
          fillDrawSuppressClick = true;
        }
        ev.preventDefault();
        return;
      }
      if (boxDrag) {
        const o = overlays.find(x => x.id === boxDrag.id);
        if (o) {
          placementFromOverlayCss(o);
          if (o.committed) postStampGeometry(o);
          else pendingPlacement = o;
          positionStampFloatBar();
        }
        boxDrag = null;
        ev.preventDefault();
        return;
      }
      // Placement is handled by viewer click — do not place on random window mouseups
      dragging = false;
    });

    let hlDrag = null;
    pagesEl.addEventListener('mousedown', (ev) => {
      if (!highlightMode || stampMode || stampPending) return;
      const p = canvasPoint(ev);
      if (!p.inside || !p.entry) return;
      hlDrag = { page: p.page, entry: p.entry, x0: p.x, y0: p.y, x1: p.x, y1: p.y, el: null };
      const layer = ensureHlLayer(p.entry);
      const box = document.createElement('div');
      box.className = 'hl-box' + (markupKind === 'mark' ? ' mark' : '');
      layer.appendChild(box);
      hlDrag.el = box;
      ev.preventDefault();
      ev.stopPropagation();
    });
    viewer.addEventListener('mousemove', (ev) => {
      if (!hlDrag) return;
      const r = hlDrag.entry.canvas.getBoundingClientRect();
      hlDrag.x1 = (ev.clientX - r.left) * (hlDrag.entry.canvas.width / r.width);
      hlDrag.y1 = (ev.clientY - r.top) * (hlDrag.entry.canvas.height / r.height);
      const left = Math.min(hlDrag.x0, hlDrag.x1);
      const top = Math.min(hlDrag.y0, hlDrag.y1);
      const w = Math.abs(hlDrag.x1 - hlDrag.x0);
      const h = Math.abs(hlDrag.y1 - hlDrag.y0);
      const sx = r.width / hlDrag.entry.canvas.width;
      const sy = r.height / hlDrag.entry.canvas.height;
      hlDrag.el.style.left = (left * sx) + 'px';
      hlDrag.el.style.top = (top * sy) + 'px';
      hlDrag.el.style.width = Math.max(2, w * sx) + 'px';
      hlDrag.el.style.height = Math.max(2, h * sy) + 'px';
    });
    window.addEventListener('mouseup', (ev) => {
      if (!hlDrag) return;
      const left = Math.min(hlDrag.x0, hlDrag.x1);
      const top = Math.min(hlDrag.y0, hlDrag.y1);
      const w = Math.abs(hlDrag.x1 - hlDrag.x0);
      const h = Math.abs(hlDrag.y1 - hlDrag.y0);
      if (w > 6 && h > 4) {
        const entry = hlDrag.entry;
        const xPt = (left / entry.canvas.width) * entry.widthPt;
        const wPt = (w / entry.canvas.width) * entry.widthPt;
        const hPt = (h / entry.canvas.height) * entry.heightPt;
        const yTopPt = (top / entry.canvas.height) * entry.heightPt;
        const hit = {
          id: uid(),
          page: hlDrag.page,
          xPt,
          yFromBottom: entry.heightPt - yTopPt - hPt,
          wPt,
          hPt,
          kind: markupKind === 'mark' ? 'mark' : 'highlight',
          el: hlDrag.el
        };
        highlights.push(hit);
        layoutHighlight(hit);
        post({
          type: 'highlight',
          id: hit.id, page: hit.page, xPt: hit.xPt, yFromBottom: hit.yFromBottom,
          wPt: hit.wPt, hPt: hit.hPt, kind: hit.kind, pageHeightPt: entry.heightPt
        });
        status.textContent = hit.kind === 'mark' ? 'Mark added — Save writes it into the PDF' : 'Highlight added — Save writes it into the PDF';
      } else if (hlDrag.el) {
        hlDrag.el.remove();
      }
      hlDrag = null;
    }, true);

    // ── Region marquee: crop the page + parse the text under the box, then stage in chat ──
    let regionDrag = null;

    function setRegionMode(on) {
      regionMode = !!on;
      if (regionMode) { exitStampMode(); exitFillMode(); highlightMode = false;
        document.getElementById('hlBtn')?.classList.remove('on');
        document.getElementById('markBtn')?.classList.remove('on'); }
      document.getElementById('regionBtn')?.classList.toggle('on', regionMode);
      pagesEl.style.cursor = regionMode ? 'crosshair' : '';
      status.textContent = regionMode ? 'Drag a box over a table or figure — releases to chat' : '';
    }

    pagesEl.addEventListener('mousedown', (ev) => {
      if (!regionMode || stampMode || stampPending) return;
      const p = canvasPoint(ev);
      if (!p.inside || !p.entry) return;
      regionDrag = { page: p.page, entry: p.entry, x0: p.x, y0: p.y, x1: p.x, y1: p.y, el: null };
      let layer = p.entry.wrap.querySelector('.region-layer');
      if (!layer) { layer = document.createElement('div'); layer.className = 'region-layer'; p.entry.wrap.appendChild(layer); }
      layer.querySelectorAll('.region-box').forEach(n => n.remove());
      const box = document.createElement('div');
      box.className = 'region-box';
      layer.appendChild(box);
      regionDrag.el = box;
      ev.preventDefault();
      ev.stopPropagation();
    });

    viewer.addEventListener('mousemove', (ev) => {
      if (!regionDrag) return;
      const r = regionDrag.entry.canvas.getBoundingClientRect();
      regionDrag.x1 = (ev.clientX - r.left) * (regionDrag.entry.canvas.width / r.width);
      regionDrag.y1 = (ev.clientY - r.top) * (regionDrag.entry.canvas.height / r.height);
      const left = Math.min(regionDrag.x0, regionDrag.x1);
      const top = Math.min(regionDrag.y0, regionDrag.y1);
      const w = Math.abs(regionDrag.x1 - regionDrag.x0);
      const h = Math.abs(regionDrag.y1 - regionDrag.y0);
      const sx = r.width / regionDrag.entry.canvas.width;
      const sy = r.height / regionDrag.entry.canvas.height;
      regionDrag.el.style.left = (left * sx) + 'px';
      regionDrag.el.style.top = (top * sy) + 'px';
      regionDrag.el.style.width = Math.max(2, w * sx) + 'px';
      regionDrag.el.style.height = Math.max(2, h * sy) + 'px';
    });

    window.addEventListener('mouseup', () => {
      if (!regionDrag) return;
      const drag = regionDrag;
      regionDrag = null;
      const w = Math.abs(drag.x1 - drag.x0);
      const h = Math.abs(drag.y1 - drag.y0);
      const cleanup = () => { if (drag.el) drag.el.remove(); };
      if (w < 8 || h < 8) { cleanup(); return; }
      handleRegionClip(drag).catch((e) => post({ type: 'error', message: 'Region clip: ' + e.message }))
        .finally(cleanup);
    }, true);

    async function handleRegionClip(drag) {
      const entry = drag.entry;
      const left = Math.round(Math.min(drag.x0, drag.x1));
      const top = Math.round(Math.min(drag.y0, drag.y1));
      const w = Math.round(Math.abs(drag.x1 - drag.x0));
      const h = Math.round(Math.abs(drag.y1 - drag.y0));

      // Crop straight from the already-rendered page canvas — no re-render.
      const crop = document.createElement('canvas');
      crop.width = w; crop.height = h;
      crop.getContext('2d').drawImage(entry.canvas, left, top, w, h, 0, 0, w, h);
      let dataUrl = '';
      try { dataUrl = crop.toDataURL('image/png'); } catch (_) { dataUrl = ''; }

      const text = await extractRegionText(drag.page, left, top, w, h, entry).catch(() => '');
      status.textContent = text ? ('Clip sent · ' + text.length + ' chars parsed') : 'Clip sent to chat';
      post({ type: 'regionClip', page: drag.page, dataUrl, text,
             wPt: (w / entry.canvas.width) * entry.widthPt,
             hPt: (h / entry.canvas.height) * entry.heightPt });
    }

    // Light "parse before AI": pull text-layer items whose baseline sits inside the box.
    async function extractRegionText(pageIndex, left, top, w, h, entry) {
      if (!pdf) return '';
      const page = await pdf.getPage(pageIndex);
      const tc = await page.getTextContent();
      const cw = entry.canvas.width, ch = entry.canvas.height;
      const x0Pt = (left / cw) * entry.widthPt;
      const x1Pt = ((left + w) / cw) * entry.widthPt;
      const yTopPt = entry.heightPt - (top / ch) * entry.heightPt;         // box top edge (higher y)
      const yBotPt = entry.heightPt - ((top + h) / ch) * entry.heightPt;   // box bottom edge (lower y)
      const picked = [];
      for (const it of tc.items) {
        const s = it.str || '';
        if (!s.trim()) continue;
        const tx = it.transform || [1, 0, 0, 1, 0, 0];
        const x = tx[4], y = tx[5], iw = it.width || 0;
        if (x + iw < x0Pt - 3 || x > x1Pt + 3) continue;
        if (y < yBotPt - 3 || y > yTopPt + 3) continue;
        picked.push({ x, y, s });
      }
      picked.sort((a, b) => (b.y - a.y) || (a.x - b.x)); // top-to-bottom, then left-to-right
      let out = '', lastY = null;
      for (const p of picked) {
        if (lastY === null) out = p.s;
        else if (Math.abs(p.y - lastY) > 3) out += '\n' + p.s;
        else out += (out.endsWith(' ') ? '' : ' ') + p.s;
        lastY = p.y;
      }
      return out.trim();
    }

    document.getElementById('prev').onclick = () => goToPage(pageNum - 1, true);
    document.getElementById('hudPrev').onclick = () => document.getElementById('prev').click();
    document.getElementById('hudNext').onclick = () => document.getElementById('next').click();
    document.getElementById('next').onclick = () => goToPage(pageNum + 1, true);
    document.getElementById('modeBtn').onclick = () => {
      continuous = !continuous;
      applyViewMode();
      if (fitMode) applyFit(false);
    };
    const searchBox = document.getElementById('searchBox');
    const searchPanel = document.getElementById('searchPanel');
    const searchToggle = document.getElementById('searchToggle');
    searchToggle.onclick = () => {
      const open = !searchPanel.classList.contains('open');
      searchPanel.classList.toggle('open', open);
      searchToggle.classList.toggle('on', open);
      if (open) {
        searchBox.focus();
        searchBox.select();
      } else {
        clearSearchHitEls();
        searchHits = [];
        searchIdx = -1;
        status.textContent = '';
      }
    };
    // Peek reading keys: smooth scroll, one screen per Page key, Home/End to the ends. The host forwards the
    // same names (Up, Down, PageUp, PageDown, Home, End) when WPF rather than this page holds the keyboard.
    function scrollKey(key) {
      const screen = Math.max(120, viewer.clientHeight * 0.9);
      switch (key) {
        case 'PageDown': viewer.scrollBy({ top: screen, behavior: 'smooth' }); return true;
        case 'PageUp': viewer.scrollBy({ top: -screen, behavior: 'smooth' }); return true;
        case 'ArrowDown': case 'Down': viewer.scrollBy({ top: 80, behavior: 'smooth' }); return true;
        case 'ArrowUp': case 'Up': viewer.scrollBy({ top: -80, behavior: 'smooth' }); return true;
        case 'Home': viewer.scrollTo({ top: 0, behavior: 'smooth' }); return true;
        case 'End': viewer.scrollTo({ top: viewer.scrollHeight, behavior: 'smooth' }); return true;
      }
      return false;
    }
    window.addEventListener('keydown', (ev) => {
      if (ev.ctrlKey || ev.altKey || ev.metaKey) return;
      if (!document.documentElement.classList.contains('slim-chrome')) return;   // peek only
      const tag = (ev.target && ev.target.tagName) || '';
      if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT' || ev.target?.isContentEditable) return;
      if (scrollKey(ev.key)) ev.preventDefault();
    });

    searchBox.addEventListener('keydown', (ev) => {
      if (ev.key === 'Enter') {
        if (ev.shiftKey) jumpSearch(-1);
        else if (searchHits.length && searchBox.value.trim() === searchQuery) jumpSearch(1);
        else runSearch(searchBox.value);
      } else if (ev.key === 'Escape') {
        searchPanel.classList.remove('open');
        searchToggle.classList.remove('on');
        clearSearchHitEls();
      }
    });
    document.getElementById('searchPrev').onclick = () => jumpSearch(-1);
    document.getElementById('searchNext').onclick = () => {
      if (searchHits.length === 0) runSearch(searchBox.value);
      else jumpSearch(1);
    };
    async function rescaleAll() {
      fitMode = false;
      viewer.classList.remove('fit-mode');
      for (const e of pageMap.values()) e.rendered = false;
      await renderVisiblePages(true);
      layoutAllOverlays();
      layoutAllFillFields();
      layoutAllHighlights();
      paintAllSearchHits();
    }

    // Button-mashing / key-autorepeat used to stack one full invalidate+rasterize per step.
    // Update the label instantly, coalesce the re-render into a single trailing pass.
    let rescaleTimer = 0;
    function scheduleRescale() {
      document.getElementById('zoomLabel').textContent = Math.round(scale * 100) + '%';
      post({ type: 'zoom', scale, fit: false });
      clearTimeout(rescaleTimer);
      rescaleTimer = setTimeout(() => { rescaleAll(); }, 120);
    }
    document.getElementById('zoomIn').onclick = () => {
      scale = Math.min(4, scale + 0.15);
      scheduleRescale();
    };
    document.getElementById('hudZoomIn').onclick = () => document.getElementById('zoomIn').click();
    document.getElementById('hudZoomOut').onclick = () => document.getElementById('zoomOut').click();
    document.getElementById('zoomOut').onclick = () => {
      scale = Math.max(0.25, scale - 0.15);
      scheduleRescale();
    };
    document.getElementById('fit').onclick = async () => {
      await applyFit(false);
    };

    // Keep Fit locked to the window — expand → page grows, still fully visible
    let fitResizeTimer = 0;
    const ro = new ResizeObserver(() => {
      if (!fitMode || !pdf) return;
      clearTimeout(fitResizeTimer);
      fitResizeTimer = setTimeout(() => {
        const next = computeFitScale();
        if (Math.abs(next - scale) < 0.015) return; // skip full raster on noise / low RAM
        applyFit(false);
      }, 200);
    });
    ro.observe(viewer);

    pageInput.addEventListener('keydown', (ev) => {
      if (ev.key === 'Enter') {
        goToPage(Number(pageInput.value) || 1, true);
        pageInput.blur();
      }
    });
    pageInput.addEventListener('change', () => goToPage(Number(pageInput.value) || 1, true));

    stampBtn.onclick = () => {
      if (stampMode || stampPending) { exitStampMode(); status.textContent = 'Placement cancelled'; }
    };
    stampConfirmBtn.onclick = () => keepPendingStamp();
    document.getElementById('hlBtn').onclick = () => setMarkupMode('highlight');
    document.getElementById('markBtn').onclick = () => setMarkupMode('mark');
    document.getElementById('regionBtn').onclick = () => setRegionMode(!regionMode);

    function onHostMessage(msg) {
      if (msg?.type === 'setDocChrome') {
        document.documentElement.classList.add('doc-app');
        document.documentElement.classList.toggle('canvas-only', !!msg.canvasOnly);
        document.documentElement.classList.toggle('slim-chrome', !!msg.slim);
        document.documentElement.classList.toggle('no-thumbs', msg.thumbs === false);
        if (msg.thumbs === false) dumpThumbsToHost();
      }
      if (msg?.type === 'loadThumbs') renderThumbBatch();
      if (msg?.type === 'find') {
        const q = String(msg.query || '');
        searchBox.value = q;
        if (q.trim()) runSearch(q);
        else {
          searchRun++;                 // stop a scan that is still walking the pages
          clearSearchHitEls();
          searchHits = [];
          searchIdx = -1;
          post({ type: 'findResult', count: 0, index: -1, done: true });
        }
      }
      if (msg?.type === 'scrollKey') scrollKey(String(msg.key || ''));
      if (msg?.type === 'findNext') jumpSearch(msg.dir < 0 ? -1 : 1);
      if (msg?.type === 'gotoPage' && pdf) goToPage(msg.page | 0, true);
      if (msg?.type === 'setZoom' && msg.scale) {
        fitMode = false;
        viewer.classList.remove('fit-mode');
        scale = Math.min(4, Math.max(0.25, Number(msg.scale) || 1.25));
        document.getElementById('zoomLabel').textContent = Math.round(scale * 100) + '%';
        post({ type: 'zoom', scale, fit: false });
        for (const e of pageMap.values()) e.rendered = false;
        renderVisiblePages(true).then(() => { layoutAllOverlays(); layoutAllFillFields(); layoutAllHighlights(); paintAllSearchHits(); });
      }
      if (msg?.type === 'fitPage') applyFit(false);
      if (msg?.type === 'enterStampMode') enterStampMode(msg.dataUrl || stampDataUrl);
      if (msg?.type === 'enterFillMode') enterFillMode();
      if (msg?.type === 'exitFillMode') exitFillMode();
      if (msg?.type === 'enterTextEditMode') {
        enterFillMode();
        bboxMode = true;
        banner.textContent = 'Native text — click a word to edit. Scans need OCR seed (not full Acrobat OCR).';
        post({ type: 'requestTextBoxes', page: pageNum });
      }
      if (msg?.type === 'autofillProfile') applyAutofillProfile(msg);
      if (msg?.type === 'seedFillTexts' || msg?.type === 'addFillTexts')
        seedFillTexts(msg.texts || [], { replace: !!msg.replace });
      if (msg?.type === 'exportPagePng') exportPagePng(msg.page | 0);
      if (msg?.type === 'exitStampMode') exitStampMode();
      if (msg?.type === 'requestFlush') flushAllToHost();
      if (msg?.type === 'scaleSelected' && msg.factor) {
        const factor = Number(msg.factor) || 1;
        if (activeFillId) scaleActiveFill(factor);
        else scaleSelectedStamp(factor);
      }
      if (msg?.type === 'setHighlightMode') {
        if (msg.on) setMarkupMode(msg.kind === 'mark' ? 'mark' : 'highlight');
        else {
          highlightMode = false;
          document.getElementById('hlBtn')?.classList.remove('on');
          document.getElementById('markBtn')?.classList.remove('on');
          status.textContent = '';
        }
      }
      if (msg?.type === 'persistFailed') {
        status.textContent = 'Save failed: ' + (msg.message || 'file unchanged') + ' — marks kept in session';
      }
      if (msg?.type === 'persistOk') {
        status.textContent = msg.final ? 'Saved into PDF' : (highlights.length ? `${highlights.length} mark(s) saved` : '');
      }
      if (msg?.type === 'setRegionMode') setRegionMode(!!msg.on);
      if (msg?.type === 'clearFillTexts') {
        for (const f of fillFields) f.el?.remove();
        fillFields = [];
        activeFillId = null;
        positionFillFloatBar();
      }
      if (msg?.type === 'setFormFields' && Array.isArray(msg.fields)) {
        formFields = msg.fields.map(f => ({
          page: Number(f.page) || 1, x: Number(f.x) || 0, y: Number(f.y) || 0,
          w: Number(f.w) || 0, h: Number(f.h) || 0, name: f.name || ''
        }));
      }
      if (msg?.type === 'setTextBoxes' && Array.isArray(msg.boxes)) {
        for (const entry of pageMap.values()) {
          entry.wrap.querySelectorAll('.bbox').forEach(n => n.remove());
        }
        bboxMode = true;
        for (const b of msg.boxes) {
          const entry = pageMap.get(b.page | 0);
          if (!entry) continue;
          const el = document.createElement('div');
          el.className = 'bbox';
          el.title = b.text || '';
          const crW = entry.canvas.clientWidth || entry.canvas.width;
          const crH = entry.canvas.clientHeight || entry.canvas.height;
          const ox = entry.canvas.offsetLeft || 0;
          const oy = entry.canvas.offsetTop || 0;
          el.style.left = (ox + (b.x / entry.widthPt) * crW) + 'px';
          el.style.top = (oy + ((entry.heightPt - b.y - b.h) / entry.heightPt) * crH) + 'px';
          el.style.width = ((b.w / entry.widthPt) * crW) + 'px';
          el.style.height = ((b.h / entry.heightPt) * crH) + 'px';
          el.onclick = (e) => {
            e.stopPropagation();
            entry.wrap.querySelectorAll('.bbox').forEach(x => x.classList.remove('selected'));
            el.classList.add('selected');
            post({ type: 'textBoxSelected', text: b.text || '', page: b.page, x: b.x, y: b.y, w: b.w, h: b.h });
            // Promote native bbox to an editable fill overlay (whiteout + replace on save).
            addFillField({
              page: b.page | 0,
              xPt: Number(b.x) || 0,
              yFromBottom: Number(b.y) || 0,
              wPt: Number(b.w) || 40,
              hPt: Number(b.h) || 12,
              fontPt: Math.max(7, (Number(b.h) || 12) * 0.85),
              text: b.text || '',
              snapped: 'native',
              cover: true,
              focus: true
            });
            el.remove();
            postFillTexts();
            enterFillMode();
          };
          entry.wrap.appendChild(el);
        }
        status.textContent = msg.boxes.length ? `${msg.boxes.length} text boxes` : 'No text on this page (try OCR later)';
      }
      if (msg?.type === 'clearStamps') clearAllOverlays();
      if (msg?.type === 'reloadPdf' && msg.fileUrl) {
        fileUrl = msg.fileUrl;
        const keep = !!msg.keepOverlays;
        // Snapshot then clear arrays — otherwise keepOverlays rebuild pushes onto stale
        // entries whose orphaned .el get resurrected by layoutAllOverlays (ghost stamps).
        const savedOverlays = keep ? overlays.map(o => ({
          id: o.id, page: o.page, xPt: o.xPt, yFromBottom: o.yFromBottom,
          stampW: o.stampW, stampH: o.stampH, pageWidthPt: o.pageWidthPt, pageHeightPt: o.pageHeightPt,
          dataUrl: o.dataUrl, committed: true
        })) : [];
        const savedFills = keep ? fillFields.map(f => ({
          id: f.id, page: f.page, xPt: f.xPt, yFromBottom: f.yFromBottom,
          wPt: f.wPt, hPt: f.hPt, fontPt: f.fontPt, text: f.text, snapped: f.snapped,
          cover: !!f.cover, el: null
        })) : [];
        const savedHighlights = keep ? snapshotHighlights() : [];
        for (const o of overlays) o.el?.remove();
        overlays = [];
        for (const f of fillFields) f.el?.remove();
        fillFields = [];
        activeFillId = null;
        for (const h of highlights) h.el?.remove();
        highlights = [];
        positionFillFloatBar();
        if (!keep) clearUncommitted();
        load().then(() => {
          if (!keep) return;
          for (const s of savedOverlays) {
            const el = createOverlayEl(s, s.dataUrl, true);
            s.el = el;
            overlays.push(s);
            layoutOverlay(s);
          }
          for (const s of savedFills) {
            s.el = createFillEl(s);
            fillFields.push(s);
            layoutFillField(s);
          }
          for (const s of savedHighlights) {
            highlights.push(s);
            layoutHighlight(s);
          }
          if (savedOverlays.length)
            selectOverlay(savedOverlays[savedOverlays.length - 1].id);
          if (savedOverlays.length || savedFills.length || savedHighlights.length)
            status.textContent = 'Saved — keep dragging boxes, marks, or typing';
        }).catch(err => {
          status.textContent = 'Reload failed: ' + err.message;
          post({ type: 'error', message: err.message });
        });
      }
    }

    window.chrome?.webview?.addEventListener('message', (ev) => {
      let msg;
      try { msg = typeof ev.data === 'string' ? JSON.parse(ev.data) : ev.data; }
      catch (_) { return; }
      onHostMessage(msg);
    });

    // Dev harness — plain-browser only (never active under WebView2 host).
    // Lets stress tests drive host messages and inspect viewer state.
    if (!window.chrome?.webview) {
      // Hidden/headless tabs never fire rAF; pdf.js chunked rendering would hang.
      window.requestAnimationFrame = (cb) => setTimeout(() => cb(performance.now()), 16);
      window.cancelAnimationFrame = (id) => clearTimeout(id);
      window.__netie = {
        sent: [],
        onHostMessage,
        seedFillTexts,
        exportPagePng,
        debug: () => ({
          pageNum, scale, stampMode, stampPending, selectedOverlayId,
          domOverlays: document.querySelectorAll('.stamp-overlay').length,
          overlays: overlays.map(o => ({
            id: o.id, page: o.page, xPt: +o.xPt.toFixed(2), yFromBottom: +o.yFromBottom.toFixed(2),
            stampW: +o.stampW.toFixed(2), stampH: +o.stampH.toFixed(2),
            committed: !!o.committed, connected: !!o.el?.isConnected
          })),
          fill: {
            mode: fillMode, activeFillId,
            domFields: document.querySelectorAll('.fill-text').length,
            fields: fillFields.map(f => ({
              id: f.id, page: f.page, xPt: +f.xPt.toFixed(2), yFromBottom: +f.yFromBottom.toFixed(2),
              wPt: +f.wPt.toFixed(2), hPt: +f.hPt.toFixed(2), fontPt: +f.fontPt.toFixed(2),
              text: f.text, snapped: f.snapped, cover: !!f.cover, connected: !!f.el?.isConnected
            }))
          },
          highlightMode, markupKind,
          highlights: highlights.map(h => ({
            id: h.id, page: h.page, xPt: +h.xPt.toFixed(2), yFromBottom: +h.yFromBottom.toFixed(2),
            wPt: +h.wPt.toFixed(2), hPt: +h.hPt.toFixed(2), kind: h.kind,
            connected: !!h.el?.isConnected
          })),
          domHighlights: document.querySelectorAll('.hl-box').length,
          glue: (() => {
            const wrap = document.querySelector('.page-wrap');
            if (!wrap) return null;
            const wr = wrap.getBoundingClientRect();
            const rel = (el) => {
              if (!el || wr.width < 1 || wr.height < 1) return null;
              const r = el.getBoundingClientRect();
              return {
                x: (r.left - wr.left) / wr.width,
                y: (r.top - wr.top) / wr.height,
                w: r.width / wr.width,
                h: r.height / wr.height
              };
            };
            const annot = wrap.querySelector('.annotationLayer');
            const section = annot?.querySelector('section');
            return {
              annotPe: annot ? getComputedStyle(annot).pointerEvents : null,
              sectionPe: section ? getComputedStyle(section).pointerEvents : null,
              widget: rel(section),
              fill: rel(wrap.querySelector('.fill-text')),
              scale
            };
          })()
        })
      };
    }

    load().catch(err => {
      status.textContent = 'Failed: ' + err.message;
      post({ type: 'error', message: err.message });
    });
  </script>
</body>
</html>
