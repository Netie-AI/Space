      const cw = entry.canvas.width, ch = entry.canvas.height;
      const x0Pt = (left / cw) * entry.widthPt;
      const x1Pt = ((left + w) / cw) * entry.widthPt;
      const yTopPt = entry.heightPt - (top / ch) * entry.heightPt;         // box top edge (higher y)
      const yBotPt = entry.heightPt - ((top + h) / ch) * entry.heightPt;   // box bottom edge (lower y)
      const picked = [];
      for (const it of tc.items) {
        const s = it.str || '';
        if (!s.trim()) continue;
        const tx = it.transform || [1, 0, 0, 1, 0, 0];
        const x = tx[4], y = tx[5], iw = it.width || 0;
        if (x + iw < x0Pt - 3 || x > x1Pt + 3) continue;
        if (y < yBotPt - 3 || y > yTopPt + 3) continue;
        picked.push({ x, y, s });
      }
      picked.sort((a, b) => (b.y - a.y) || (a.x - b.x)); // top-to-bottom, then left-to-right
      let out = '', lastY = null;
      for (const p of picked) {
        if (lastY === null) out = p.s;
        else if (Math.abs(p.y - lastY) > 3) out += '\n' + p.s;
        else out += (out.endsWith(' ') ? '' : ' ') + p.s;
        lastY = p.y;
      }
      return out.trim();
    }

    document.getElementById('prev').onclick = () => goToPage(pageNum - 1, true);
    document.getElementById('next').onclick = () => goToPage(pageNum + 1, true);
    document.getElementById('modeBtn').onclick = () => {
      continuous = !continuous;
      applyViewMode();
      if (fitMode) applyFit(false);
    };
    const searchBox = document.getElementById('searchBox');
    const searchPanel = document.getElementById('searchPanel');
    const searchToggle = document.getElementById('searchToggle');
    searchToggle.onclick = () => {
      const open = !searchPanel.classList.contains('open');
      searchPanel.classList.toggle('open', open);
      searchToggle.classList.toggle('on', open);
      if (open) {
        searchBox.focus();
        searchBox.select();
      } else {
        clearSearchHitEls();
        searchHits = [];
        searchIdx = -1;
        status.textContent = '';
      }
    };
    searchBox.addEventListener('keydown', (ev) => {
      if (ev.key === 'Enter') {
        if (ev.shiftKey) jumpSearch(-1);
        else if (searchHits.length && searchBox.value.trim() === searchQuery) jumpSearch(1);
        else runSearch(searchBox.value);
      } else if (ev.key === 'Escape') {
        searchPanel.classList.remove('open');
        searchToggle.classList.remove('on');
        clearSearchHitEls();
      }
    });
    document.getElementById('searchPrev').onclick = () => jumpSearch(-1);
    document.getElementById('searchNext').onclick = () => {
      if (searchHits.length === 0) runSearch(searchBox.value);
      else jumpSearch(1);
    };
    async function rescaleAll() {
      fitMode = false;
      viewer.classList.remove('fit-mode');
      for (const e of pageMap.values()) e.rendered = false;
      await renderVisiblePages(true);
      layoutAllOverlays();
      layoutAllFillFields();
      layoutAllHighlights();
      paintAllSearchHits();
    }

    // Button-mashing / key-autorepeat used to stack one full invalidate+rasterize per step.
    // Update the label instantly, coalesce the re-render into a single trailing pass.
    let rescaleTimer = 0;
    function scheduleRescale() {
      document.getElementById('zoomLabel').textContent = Math.round(scale * 100) + '%';
      clearTimeout(rescaleTimer);
      rescaleTimer = setTimeout(() => { rescaleAll(); }, 120);
    }
    document.getElementById('zoomIn').onclick = () => {
      scale = Math.min(4, scale + 0.15);
      scheduleRescale();
    };
    document.getElementById('zoomOut').onclick = () => {
      scale = Math.max(0.25, scale - 0.15);
      scheduleRescale();
    };
    document.getElementById('fit').onclick = async () => {
      await applyFit(false);
    };

    // Keep Fit locked to the window — expand → page grows, still fully visible
    let fitResizeTimer = 0;
    const ro = new ResizeObserver(() => {
      if (!fitMode || !pdf) return;
      clearTimeout(fitResizeTimer);
      fitResizeTimer = setTimeout(() => applyFit(false), 80);
    });
    ro.observe(viewer);

    pageInput.addEventListener('keydown', (ev) => {
      if (ev.key === 'Enter') {
        goToPage(Number(pageInput.value) || 1, true);
        pageInput.blur();
      }
    });
    pageInput.addEventListener('change', () => goToPage(Number(pageInput.value) || 1, true));

    stampBtn.onclick = () => {
      if (stampMode || stampPending) { exitStampMode(); status.textContent = 'Placement cancelled'; }
    };
    stampConfirmBtn.onclick = () => keepPendingStamp();
    document.getElementById('hlBtn').onclick = () => setMarkupMode('highlight');
    document.getElementById('markBtn').onclick = () => setMarkupMode('mark');
    document.getElementById('regionBtn').onclick = () => setRegionMode(!regionMode);

    function onHostMessage(msg) {
      if (msg?.type === 'gotoPage' && pdf) goToPage(msg.page | 0, true);
      if (msg?.type === 'setZoom' && msg.scale) {
        fitMode = false;
        viewer.classList.remove('fit-mode');
        scale = Math.min(4, Math.max(0.25, Number(msg.scale) || 1.25));
        for (const e of pageMap.values()) e.rendered = false;
        renderVisiblePages(true).then(() => { layoutAllOverlays(); layoutAllFillFields(); layoutAllHighlights(); paintAllSearchHits(); });
      }
      if (msg?.type === 'fitPage') applyFit(false);
      if (msg?.type === 'enterStampMode') enterStampMode(msg.dataUrl || stampDataUrl);
      if (msg?.type === 'enterFillMode') enterFillMode();
      if (msg?.type === 'exitFillMode') exitFillMode();
      if (msg?.type === 'exitStampMode') exitStampMode();
      if (msg?.type === 'requestFlush') flushAllToHost();
      if (msg?.type === 'scaleSelected' && msg.factor) {
        const factor = Number(msg.factor) || 1;
        if (activeFillId) scaleActiveFill(factor);
        else scaleSelectedStamp(factor);
      }
      if (msg?.type === 'setHighlightMode') {
        if (msg.on) setMarkupMode(msg.kind === 'mark' ? 'mark' : 'highlight');
        else {
          highlightMode = false;
          document.getElementById('hlBtn')?.classList.remove('on');
          document.getElementById('markBtn')?.classList.remove('on');
          status.textContent = '';
        }
      }
      if (msg?.type === 'persistFailed') {
        status.textContent = 'Save failed: ' + (msg.message || 'file unchanged') + ' — marks kept in session';
      }
      if (msg?.type === 'persistOk') {
        status.textContent = msg.final ? 'Saved into PDF' : (highlights.length ? `${highlights.length} mark(s) saved` : '');
      }
      if (msg?.type === 'setRegionMode') setRegionMode(!!msg.on);
      if (msg?.type === 'clearFillTexts') {
        for (const f of fillFields) f.el?.remove();
        fillFields = [];
        activeFillId = null;
        positionFillFloatBar();
      }
      if (msg?.type === 'setFormFields' && Array.isArray(msg.fields)) {
        formFields = msg.fields.map(f => ({
          page: Number(f.page) || 1, x: Number(f.x) || 0, y: Number(f.y) || 0,
          w: Number(f.w) || 0, h: Number(f.h) || 0, name: f.name || ''
        }));
      }
      if (msg?.type === 'setTextBoxes' && Array.isArray(msg.boxes)) {
        for (const entry of pageMap.values()) {
          entry.wrap.querySelectorAll('.bbox').forEach(n => n.remove());
        }
        if (!bboxMode) return;
        for (const b of msg.boxes) {
          const entry = pageMap.get(b.page | 0);
          if (!entry) continue;
          const el = document.createElement('div');
          el.className = 'bbox';
          el.title = b.text || '';
          const crW = entry.canvas.getBoundingClientRect().width || entry.canvas.width;
          const crH = entry.canvas.getBoundingClientRect().height || entry.canvas.height;
          el.style.left = ((b.x / entry.widthPt) * crW) + 'px';
          el.style.top = (((entry.heightPt - b.y - b.h) / entry.heightPt) * crH) + 'px';
          el.style.width = ((b.w / entry.widthPt) * crW) + 'px';
          el.style.height = ((b.h / entry.heightPt) * crH) + 'px';
          el.onclick = (e) => {
            e.stopPropagation();
            entry.wrap.querySelectorAll('.bbox').forEach(x => x.classList.remove('selected'));
            el.classList.add('selected');
            post({ type: 'textBoxSelected', text: b.text || '', page: b.page, x: b.x, y: b.y, w: b.w, h: b.h });
          };
          entry.wrap.appendChild(el);
        }
        status.textContent = msg.boxes.length ? `${msg.boxes.length} text boxes` : 'No text on this page (try OCR later)';
      }
      if (msg?.type === 'clearStamps') clearAllOverlays();
      if (msg?.type === 'reloadPdf' && msg.fileUrl) {
        fileUrl = msg.fileUrl;
        const keep = !!msg.keepOverlays;
        // Snapshot then clear arrays — otherwise keepOverlays rebuild pushes onto stale
        // entries whose orphaned .el get resurrected by layoutAllOverlays (ghost stamps).
        const savedOverlays = keep ? overlays.map(o => ({
          id: o.id, page: o.page, xPt: o.xPt, yFromBottom: o.yFromBottom,
          stampW: o.stampW, stampH: o.stampH, pageWidthPt: o.pageWidthPt, pageHeightPt: o.pageHeightPt,
          dataUrl: o.dataUrl, committed: true
        })) : [];
        const savedFills = keep ? fillFields.map(f => ({
          id: f.id, page: f.page, xPt: f.xPt, yFromBottom: f.yFromBottom,
          wPt: f.wPt, hPt: f.hPt, fontPt: f.fontPt, text: f.text, snapped: f.snapped, el: null
        })) : [];
        const savedHighlights = keep ? snapshotHighlights() : [];
        for (const o of overlays) o.el?.remove();
        overlays = [];
        for (const f of fillFields) f.el?.remove();
        fillFields = [];
        activeFillId = null;
        for (const h of highlights) h.el?.remove();
        highlights = [];
        positionFillFloatBar();
        if (!keep) clearUncommitted();
        load().then(() => {
          if (!keep) return;
          for (const s of savedOverlays) {
            const el = createOverlayEl(s, s.dataUrl, true);
            s.el = el;
            overlays.push(s);
            layoutOverlay(s);
          }
          for (const s of savedFills) {
            s.el = createFillEl(s);
            fillFields.push(s);
            layoutFillField(s);
          }
          for (const s of savedHighlights) {
            highlights.push(s);
            layoutHighlight(s);
          }
          if (savedOverlays.length)
            selectOverlay(savedOverlays[savedOverlays.length - 1].id);
          if (savedOverlays.length || savedFills.length || savedHighlights.length)
            status.textContent = 'Saved — keep dragging boxes, marks, or typing';
        }).catch(err => {
          status.textContent = 'Reload failed: ' + err.message;
          post({ type: 'error', message: err.message });
        });
      }
    }

    window.chrome?.webview?.addEventListener('message', (ev) => {
      let msg;
      try { msg = typeof ev.data === 'string' ? JSON.parse(ev.data) : ev.data; }
      catch (_) { return; }
      onHostMessage(msg);
    });

    // Dev harness — plain-browser only (never active under WebView2 host).
    // Lets stress tests drive host messages and inspect viewer state.
    if (!window.chrome?.webview) {
      // Hidden/headless tabs never fire rAF; pdf.js chunked rendering would hang.
      window.requestAnimationFrame = (cb) => setTimeout(() => cb(performance.now()), 16);
      window.cancelAnimationFrame = (id) => clearTimeout(id);
      window.__netie = {
        sent: [],
        onHostMessage,
        debug: () => ({
          pageNum, scale, stampMode, stampPending, selectedOverlayId,
          domOverlays: document.querySelectorAll('.stamp-overlay').length,
          overlays: overlays.map(o => ({
            id: o.id, page: o.page, xPt: +o.xPt.toFixed(2), yFromBottom: +o.yFromBottom.toFixed(2),
            stampW: +o.stampW.toFixed(2), stampH: +o.stampH.toFixed(2),
            committed: !!o.committed, connected: !!o.el?.isConnected
          })),
          fill: {
            mode: fillMode, activeFillId,
            domFields: document.querySelectorAll('.fill-text').length,
            fields: fillFields.map(f => ({
              id: f.id, page: f.page, xPt: +f.xPt.toFixed(2), yFromBottom: +f.yFromBottom.toFixed(2),
              wPt: +f.wPt.toFixed(2), hPt: +f.hPt.toFixed(2), fontPt: +f.fontPt.toFixed(2),
              text: f.text, snapped: f.snapped, connected: !!f.el?.isConnected
            }))
          },
          highlightMode, markupKind,
          highlights: highlights.map(h => ({
            id: h.id, page: h.page, xPt: +h.xPt.toFixed(2), yFromBottom: +h.yFromBottom.toFixed(2),
            wPt: +h.wPt.toFixed(2), hPt: +h.hPt.toFixed(2), kind: h.kind,
            connected: !!h.el?.isConnected
          })),
          domHighlights: document.querySelectorAll('.hl-box').length
        })
      };
    }

    load().catch(err => {
      status.textContent = 'Failed: ' + err.message;
      post({ type: 'error', message: err.message });
    });
  </script>
</body>
</html>
