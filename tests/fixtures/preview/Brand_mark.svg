<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="NETIE SPACE mark">
  <defs>
    <!-- Indie sticker glass — flat, cute, soft (not photoreal CGI) -->
    <linearGradient id="glass" x1="18%" y1="12%" x2="82%" y2="88%">
      <stop offset="0%" stop-color="#C8F5EE"/>
      <stop offset="45%" stop-color="#6FD4C8"/>
      <stop offset="100%" stop-color="#3AAFA3"/>
    </linearGradient>
    <linearGradient id="glassRim" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#2A8F86" stop-opacity="0.25"/>
    </linearGradient>
    <linearGradient id="diamond" x1="30%" y1="10%" x2="70%" y2="90%">
      <stop offset="0%" stop-color="#F2FFFC"/>
      <stop offset="55%" stop-color="#9EE8DE"/>
      <stop offset="100%" stop-color="#5EC4B8"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="512" height="512" rx="112" fill="#10141C"/>

  <!--
    Sketch geometry: concave square with points at CORNERS (rotate 45° from N/S/E/W).
    Soft plump tips — indie / cute liquid-glass sticker.
  -->
  <g filter="url(#soft)" transform="translate(256 256) rotate(45)">
    <path
      d="M 0,-148
         C 26,-58 58,-26 148,0
         C 58,26 26,58 0,148
         C -26,58 -58,26 -148,0
         C -58,-26 -26,-58 0,-148 Z"
      fill="url(#glass)"
      stroke="url(#glassRim)"
      stroke-width="3"
      stroke-linejoin="round"/>

    <!-- Cute highlight blob -->
    <ellipse cx="-36" cy="-52" rx="42" ry="26" fill="#FFFFFF" opacity="0.32"/>
    <ellipse cx="-48" cy="-62" rx="14" ry="9" fill="#FFFFFF" opacity="0.45"/>

    <!-- Inner diamond (absorb slot) — pointy up in world space after rotate -->
    <g transform="rotate(-45)">
      <path
        d="M 0,-46 L 34,0 L 0,46 L -34,0 Z"
        fill="url(#diamond)"
        stroke="#FFFFFF"
        stroke-opacity="0.35"
        stroke-width="2"
        stroke-linejoin="round"/>
      <ellipse cx="-8" cy="-14" rx="10" ry="6" fill="#FFFFFF" opacity="0.4"/>
    </g>
  </g>
</svg>
